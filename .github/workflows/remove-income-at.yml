name: Remove income heading at

on:
  push:
    paths:
      - '.github/workflows/remove-income-at.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update income headings
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('MONTHLY INCOME AT', 'MONTHLY INCOME')
          text = text.replace('Monthly income at', 'Monthly income')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-income-at.yml
          git add index.html .github/workflows/remove-income-at.yml
          git commit -m "Remove 'at' from monthly income headings"
          git push
