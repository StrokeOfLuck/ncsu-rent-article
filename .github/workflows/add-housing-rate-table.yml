name: Add housing rate table
on:
  push:
    paths:
      - .github/workflows/add-housing-rate-table.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recreated housing rates table
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-housing-rate-table.yml
          git add references.html .github/workflows/add-housing-rate-table.yml
          git commit -m "Add recreated housing rates table to Reference 15 [skip ci]"
          git push
