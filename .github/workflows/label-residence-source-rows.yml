name: Label residence hall source rows
on:
  push:
    paths:
      - .github/workflows/label-residence-source-rows.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add source row labels to residence hall math
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('references.html')
          s = p.read_text(encoding='utf-8')

          old_double = '''      <div class="fact">
        <div class="fact-label">Residence hall double*</div>
        <div class="fact-value">
          <strong>Low — 2025–26:</strong> ($3,800 + $150) × 2 ÷ 9 = <strong>$877.78/month ≈ $878</strong><br>
          <strong>Midpoint:</strong> (($3,800 + $3,970) ÷ 2 + $150) × 2 ÷ 9 = <strong>$896.67/month ≈ $897</strong><br>
          <strong>High — 2026–27 projected:</strong> ($3,970 + $150) × 2 ÷ 9 = <strong>$915.56/month ≈ $916</strong>
        </div>
      </div>'''

          new_double = '''      <div class="fact">
        <div class="fact-label">Residence hall double*</div>
        <div class="fact-value">
          <strong>Source row: “Doubles”</strong> — $3,800 (2025–26); $3,970 projected (2026–27).<br><br>
          <strong>Low — 2025–26 Doubles:</strong> ($3,800 + $150) × 2 ÷ 9 = <strong>$877.78/month ≈ $878</strong><br>
          <strong>Midpoint — between the two Double rates:</strong> (($3,800 + $3,970) ÷ 2 + $150) × 2 ÷ 9 = <strong>$896.67/month ≈ $897</strong><br>
          <strong>High — 2026–27 projected Doubles:</strong> ($3,970 + $150) × 2 ÷ 9 = <strong>$915.56/month ≈ $916</strong>
        </div>
      </div>'''

          old_single = '''      <div class="fact">
        <div class="fact-label">Residence hall single</div>
        <div class="fact-value">
          <strong>Low — 2025–26:</strong> ($4,275 + $150) × 2 ÷ 9 = <strong>$983.33/month ≈ $983</strong><br>
          <strong>Midpoint:</strong> (($4,275 + $4,600) ÷ 2 + $150) × 2 ÷ 9 = <strong>$1,019.44/month ≈ $1,019</strong><br>
          <strong>High — 2026–27 projected:</strong> ($4,600 + $150) × 2 ÷ 9 = <strong>$1,055.56/month ≈ $1,056</strong>
        </div>
      </div>'''

          new_single = '''      <div class="fact">
        <div class="fact-label">Residence hall single</div>
        <div class="fact-value">
          <strong>Source row: “Singles”</strong> — $4,275 (2025–26); $4,600 projected (2026–27).<br><br>
          <strong>Low — 2025–26 Singles:</strong> ($4,275 + $150) × 2 ÷ 9 = <strong>$983.33/month ≈ $983</strong><br>
          <strong>Midpoint — between the two Single rates:</strong> (($4,275 + $4,600) ÷ 2 + $150) × 2 ÷ 9 = <strong>$1,019.44/month ≈ $1,019</strong><br>
          <strong>High — 2026–27 projected Singles:</strong> ($4,600 + $150) × 2 ÷ 9 = <strong>$1,055.56/month ≈ $1,056</strong>
        </div>
      </div>'''

          if old_double not in s:
              raise SystemExit('Double math block not found')
          if old_single not in s:
              raise SystemExit('Single math block not found')

          s = s.replace(old_double, new_double, 1)
          s = s.replace(old_single, new_single, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/label-residence-source-rows.yml
          git add references.html .github/workflows/label-residence-source-rows.yml
          git commit -m "Label residence hall source rows in math [skip ci]"
          git push
