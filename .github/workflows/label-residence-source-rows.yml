name: Label residence hall source rows
on:
  push:
    paths:
      - .github/workflows/label-residence-source-rows.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add source row labels to residence hall math
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(' w7cgOSA9IDxzdHJvbmc+JDg5Ni42Ny9tb250aCDiiYggJDg5Nzwvc3Ryb25nPjxicj4KICAgICAgICAgIDxzdHJvbmc+SGlnaCDigJQgMjAyNuKAkzI3IHByb2plY3RlZDo8L3N0cm9uZz4gKCQzLDk3MCArICQxNTApIMOXIDIg    '))"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/label-residence-source-rows.yml
          git add references.html .github/workflows/label-residence-source-rows.yml
          git commit -m "Label residence hall source rows in math [skip ci]"
          git push
