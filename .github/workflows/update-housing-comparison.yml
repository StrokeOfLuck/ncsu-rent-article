name: Update housing comparison and reference math

on:
  push:
    paths:
      - '.github/workflows/update-housing-comparison.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply housing updates
        run: python scripts/update_housing_comparison.py
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html references.html .github/workflows/update-housing-comparison.yml scripts/update_housing_comparison.py
          git commit -m 'Update 2026-27 housing benchmarks and comparison math [skip ci]' || exit 0
          git push
