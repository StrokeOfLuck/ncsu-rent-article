name: Restore utility workbook highlights

on:
  push:
    branches: [main]
    paths:
      - '.tmp/restore-utility-highlights.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore 74-listing labels and six green internet rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy
          import tempfile
          import zipfile
          import xml.etree.ElementTree as ET

          path = Path("data/audits/ncsu-room-utilities-audit.xlsx")
          NS = "http://schemas.openxmlformats.org/spreadsheetml/2006/main"
          ET.register_namespace("", NS)
          q = lambda tag: f"{{{NS}}}{tag}"

          with zipfile.ZipFile(path, "r") as zin:
              files = {name: zin.read(name) for name in zin.namelist()}

          def set_inline_text(root, ref, text):
              cell = root.find(f".//{q('c')}[@r='{ref}']")
              if cell is None:
                  raise RuntimeError(f"Missing cell {ref}")
              cell.set("t", "inlineStr")
              for child in list(cell):
                  cell.remove(child)
              isel = ET.SubElement(cell, q("is"))
              t = ET.SubElement(isel, q("t"))
              t.set("{http://www.w3.org/XML/1998/namespace}space", "preserve")
              t.text = text

          s1 = ET.fromstring(files["xl/worksheets/sheet1.xml"])
          set_inline_text(
              s1, "A2",
              "Sept. 9 snapshot. 41 of 74 Main Campus private-bedroom analytic listings (55.4%) affirmatively establish at least one selected core utility as included through saved structured utility fields, saved listing wording or both."
          )
          set_inline_text(s1, "A3", "Utility-including listings")
          set_inline_text(s1, "B3", "41 of 74 · 55.4%")

          s2 = ET.fromstring(files["xl/worksheets/sheet2.xml"])
          set_inline_text(
              s2, "A2",
              "Eight of 74 Main Campus private-bedroom analytic listings (10.8%) explicitly state in saved wording that all utilities are included or that the rent is inclusive of all utilities. Six of those eight (6 of 74 overall; 8.1%) also explicitly include internet/Wi-Fi. Internet/Wi-Fi is tracked separately and is not assumed."
          )
          set_inline_text(s2, "A3", "All-utilities listings")
          set_inline_text(s2, "B3", "8 of 74 · 10.8%")
          set_inline_text(s2, "E3", "All utilities + internet/Wi-Fi")
          set_inline_text(s2, "F3", "6 of 74 · 8.1%")

          styles = ET.fromstring(files["xl/styles.xml"])
          fills = styles.find(q("fills"))
          cellxfs = styles.find(q("cellXfs"))
          if fills is None or cellxfs is None:
              raise RuntimeError("Workbook styles are missing fills/cellXfs")

          green_fill = ET.Element(q("fill"))
          pattern = ET.SubElement(green_fill, q("patternFill"), {"patternType": "solid"})
          ET.SubElement(pattern, q("fgColor"), {"rgb": "FFE2F0D9"})
          ET.SubElement(pattern, q("bgColor"), {"indexed": "64"})
          green_fill_id = len(list(fills))
          fills.append(green_fill)
          fills.set("count", str(len(list(fills))))

          style_map = {}
          def green_style(old_style):
              old_style = int(old_style or 0)
              if old_style in style_map:
                  return style_map[old_style]
              old_xf = list(cellxfs)[old_style]
              new_xf = copy.deepcopy(old_xf)
              new_xf.set("fillId", str(green_fill_id))
              new_xf.set("applyFill", "1")
              new_id = len(list(cellxfs))
              cellxfs.append(new_xf)
              cellxfs.set("count", str(len(list(cellxfs))))
              style_map[old_style] = new_id
              return new_id

          # The six all-utilities listings with internet/Wi-Fi explicitly included.
          for row_num in (6, 7, 8, 9, 10, 12):
              row = s2.find(f".//{q('row')}[@r='{row_num}']")
              if row is None:
                  raise RuntimeError(f"Missing row {row_num}")
              for cell in row.findall(q("c")):
                  ref = cell.get("r", "")
                  # Highlight columns A:P only.
                  col = "".join(ch for ch in ref if ch.isalpha())
                  if col and ord(col[0]) <= ord("P"):
                      cell.set("s", str(green_style(cell.get("s"))))

          files["xl/worksheets/sheet1.xml"] = ET.tostring(s1, encoding="utf-8", xml_declaration=True)
          files["xl/worksheets/sheet2.xml"] = ET.tostring(s2, encoding="utf-8", xml_declaration=True)
          files["xl/styles.xml"] = ET.tostring(styles, encoding="utf-8", xml_declaration=True)

          tmp = path.with_suffix(".tmp.xlsx")
          with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as zout:
              for name, data in files.items():
                  zout.writestr(name, data)

          with zipfile.ZipFile(tmp, "r") as z:
              bad = z.testzip()
              if bad is not None:
                  raise RuntimeError(f"Bad XLSX member: {bad}")

          tmp.replace(path)
          print("Restored 74-listing denominator text and green highlighting for six internet/Wi-Fi rows.")
          PY

      - name: Commit workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/ncsu-room-utilities-audit.xlsx
          git rm -f .tmp/restore-utility-highlights.trigger
          git commit -m "Restore utility audit denominator and green highlights"
          git push
