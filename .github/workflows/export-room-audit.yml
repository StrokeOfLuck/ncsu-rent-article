name: Export room audit workbook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.tmp/export-room-audit.trigger'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: room-audit-current
          path: data/audits/ncsu-room-rent-audit.xlsx
          if-no-files-found: error
