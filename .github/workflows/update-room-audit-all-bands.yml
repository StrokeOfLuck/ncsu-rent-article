name: Update room audit all-band tabs

on:
  push:
    branches: [main]
    paths:
      - '.tmp/update-room-audit-all-bands.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install workbook library
        run: python -m pip install --quiet openpyxl
      - name: Rebuild reader-facing all-band tabs
        shell: bash
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          path = "data/audits/ncsu-room-rent-audit.xlsx"
          wb = load_workbook(path)

          DARK = "2D485D"
          PALE = "E8EEF2"
          WHITE = "FFFFFF"

          def band_rows(sheet_name):
              ws = wb[sheet_name]
              out = []
              r = 5
              while True:
                  name = ws.cell(r, 1).value
                  low = ws.cell(r, 2).value
                  high = ws.cell(r, 3).value
                  if name in (None, ""):
                      break
                  if not isinstance(low, (int, float)) or not isinstance(high, (int, float)):
                      break
                  midpoint = ws.cell(r, 4).value
                  distance = ws.cell(r, 5).value
                  listing_id = ws.cell(r, 6).value
                  url = ws.cell(r, 7).value
                  out.append((name, low, high, midpoint, distance, listing_id, url))
                  r += 1
              return out

          def clear_or_create(name):
              if name in wb.sheetnames:
                  ws = wb[name]
                  for rng in list(ws.merged_cells.ranges):
                      ws.unmerge_cells(str(rng))
                  for row in ws.iter_rows():
                      for c in row:
                          c.value = None
                  return ws
              return wb.create_sheet(name)

          def style_font(cell, bold=False, color=None, size=10):
              cell.font = Font(name="Arial", size=size, bold=bold, color=color)

          def add_all_bands(name, campus_label, components):
              ws = clear_or_create(name)
              combined = []
              for band_label, source in components:
                  for row in band_rows(source):
                      combined.append((band_label, row))
              n = len(combined)
              end = 4 + n

              ws["A1"] = f"{campus_label} all three bands — {n} room listings"
              style_font(ws["A1"], bold=True)
              ws["A2"] = (
                  f"Sept. 9, 2026 advertised-price snapshot. Exact {campus_label} all-bands view used "
                  f"to verify the article interactive. One vote per listing; midpoint=(low+high)/2."
              )
              style_font(ws["A2"])
              ws.merge_cells("A1:H1")
              ws.merge_cells("A2:H2")
              ws["A2"].alignment = Alignment(wrap_text=True, vertical="top")

              headers = ["Listing name","Low ($/month)","High ($/month)","Midpoint ($/month)",
                         "Distance (mi)","Band","Listing ID","Source URL"]
              for col, val in enumerate(headers, 1):
                  c = ws.cell(4, col, val)
                  c.fill = PatternFill("solid", fgColor=DARK)
                  style_font(c, bold=True, color=WHITE)
                  c.alignment = Alignment(wrap_text=True, vertical="center")

              for i, (band_label, row) in enumerate(combined, 5):
                  name_v, low, high, midpoint, dist, lid, url = row
                  vals = [name_v, low, high, None, dist, band_label, lid, url]
                  for col, val in enumerate(vals, 1):
                      ws.cell(i, col, val)
                      style_font(ws.cell(i,col))
                  ws.cell(i,4, f"=(B{i}+C{i})/2")
                  for col in (2,3,4):
                      ws.cell(i,col).number_format = '$#,##0.00'
                  ws.cell(i,5).number_format = '0.000'

              math = end + 3
              labels = ["Prices used (COUNT)","Total advertised rent (SUM)",
                        "Average (sum / count)","Median listing midpoint"]
              for j, label in enumerate(labels):
                  c = ws.cell(math+j,1,label)
                  c.fill = PatternFill("solid", fgColor=PALE)
                  style_font(c,bold=True)
              ws.cell(math,2,f"=COUNT(B5:B{end})")
              ws.cell(math,3,f"=COUNT(C5:C{end})")
              ws.cell(math,4,f"=COUNT(D5:D{end})")
              for c in ws[math][1:4]:
                  c.fill = PatternFill("solid", fgColor=PALE)
                  style_font(c,bold=True)
              ws.cell(math+1,2,f"=SUM(B5:B{end})")
              ws.cell(math+1,3,f"=SUM(C5:C{end})")
              ws.cell(math+1,4,f"=SUM(D5:D{end})")
              ws.cell(math+2,2,f"=B{math+1}/B{math}")
              ws.cell(math+2,3,f"=C{math+1}/C{math}")
              ws.cell(math+2,4,f"=D{math+1}/D{math}")
              ws.cell(math+3,4,f"=MEDIAN(D5:D{end})")
              for r in range(math+1, math+4):
                  for c in range(2,5):
                      ws.cell(r,c).number_format = '$#,##0.00'
                      style_font(ws.cell(r,c))

              band_hdr = math + 6
              band_headers = [f"{campus_label} band","Listings","Low-price sum","High-price sum","Midpoint sum","Mean midpoint"]
              for col,val in enumerate(band_headers,1):
                  c=ws.cell(band_hdr,col,val)
                  c.fill=PatternFill("solid",fgColor=DARK)
                  style_font(c,bold=True,color=WHITE)
                  c.alignment=Alignment(wrap_text=True)

              band_labels=[x[0] for x in components]
              for idx, band in enumerate(band_labels,1):
                  r=band_hdr+idx
                  ws.cell(r,1,band)
                  ws.cell(r,2,f'=COUNTIF($F$5:$F{end},A{r})')
                  ws.cell(r,3,f'=SUMIF($F$5:$F{end},A{r},$B$5:$B{end})')
                  ws.cell(r,4,f'=SUMIF($F$5:$F{end},A{r},$C$5:$C{end})')
                  ws.cell(r,5,f'=SUMIF($F$5:$F{end},A{r},$D$5:$D{end})')
                  ws.cell(r,6,f'=E{r}/B{r}')
                  ws.cell(r,1).fill=PatternFill("solid",fgColor=PALE)
                  style_font(ws.cell(r,1),bold=True)
                  for c in range(2,7):
                      style_font(ws.cell(r,c))
                  for c in range(3,7):
                      ws.cell(r,c).number_format='$#,##0.00'

              total=band_hdr+len(band_labels)+1
              ws.cell(total,1,"All three bands")
              ws.cell(total,2,f"=SUM(B{band_hdr+1}:B{total-1})")
              ws.cell(total,3,f"=SUM(C{band_hdr+1}:C{total-1})")
              ws.cell(total,4,f"=SUM(D{band_hdr+1}:D{total-1})")
              ws.cell(total,5,f"=SUM(E{band_hdr+1}:E{total-1})")
              ws.cell(total,6,f"=E{total}/B{total}")
              for c in range(1,7):
                  ws.cell(total,c).fill=PatternFill("solid",fgColor=PALE)
                  style_font(ws.cell(total,c),bold=True)
              for c in range(3,7):
                  ws.cell(total,c).number_format='$#,##0.00'

              draft=total+3
              draft_headers=["Draft page check","Rounded average low","Rounded average high","Rounded midpoint"]
              for col,val in enumerate(draft_headers,1):
                  c=ws.cell(draft,col,val)
                  c.fill=PatternFill("solid",fgColor=DARK)
                  style_font(c,bold=True,color=WHITE)
              ws.cell(draft+1,1,"Displayed values")
              ws.cell(draft+1,2,f"=ROUND(B{math+2},0)")
              ws.cell(draft+1,3,f"=ROUND(C{math+2},0)")
              ws.cell(draft+1,4,f"=ROUND(D{math+2},0)")
              for c in range(1,5):
                  ws.cell(draft+1,c).fill=PatternFill("solid",fgColor=PALE)
                  style_font(ws.cell(draft+1,c),bold=True)
              for c in range(2,5):
                  ws.cell(draft+1,c).number_format='$#,##0'

              widths={1:38,2:16,3:16,4:18,5:15,6:14,7:16,8:54}
              for col,w in widths.items():
                  ws.column_dimensions[get_column_letter(col)].width=w
              ws.freeze_panes="A5"
              return ws, n

          if "Rooms" in wb.sheetnames:
              wb.remove(wb["Rooms"])
          if "Main sample (74)" in wb.sheetnames:
              wb.remove(wb["Main sample (74)"])

          main_ws, main_n = add_all_bands(
              "Main all three bands (74)", "Main Campus",
              [("0-1 mi","Main 0-1 mi"),("1-3 mi","Main 1-3 mi"),("3-5 mi","Main 3-5 mi")]
          )
          cent_ws, cent_n = add_all_bands(
              "Centennial all bands (74)", "Centennial Campus",
              [("0-1 mi","Centennial 0-1 mi"),("1-3 mi","Centennial 1-3 mi"),("3-5 mi","Centennial 3-5 mi")]
          )
          bio_ws, bio_n = add_all_bands(
              "Biomedical all bands (70)", "Biomedical Campus",
              [("0-1 mi","Biomedical 0-1 mi"),("1-3 mi","Biomedical 1-3 mi"),("3-5 mi","Biomedical 3-5 mi")]
          )

          if (main_n,cent_n,bio_n)!=(74,74,70):
              raise RuntimeError(f"Unexpected all-band counts: {(main_n,cent_n,bio_n)}")

          if "Summary" in wb.sheetnames:
              ws=wb["Summary"]
              for r in range(1, ws.max_row+1):
                  if str(ws.cell(r,1).value or "").strip()=="All three areas, unique IDs":
                      for c in range(1,8):
                          ws.cell(r,c).value=None

          desired=[
              "Summary",
              "Main all three bands (74)","Main 0-1 mi","Main 1-3 mi","Main 3-5 mi",
              "Centennial all bands (74)","Centennial 0-1 mi","Centennial 1-3 mi","Centennial 3-5 mi",
              "Biomedical all bands (70)","Biomedical 0-1 mi","Biomedical 1-3 mi","Biomedical 3-5 mi",
              "Excluded","Listings"
          ]
          ordered=[wb[n] for n in desired if n in wb.sheetnames]
          ordered += [ws for ws in wb.worksheets if ws.title not in desired]
          wb._sheets=ordered

          try:
              wb.calculation.fullCalcOnLoad = True
              wb.calculation.forceFullCalc = True
              wb.calculation.calcMode = "auto"
          except Exception:
              pass

          wb.save(path)

          def stats(names):
              rows=[]
              for n in names:
                  rows += band_rows(n)
              lows=[r[1] for r in rows]
              highs=[r[2] for r in rows]
              mids=[(a+b)/2 for a,b in zip(lows,highs)]
              return len(rows),sum(lows),sum(highs),sum(mids),sum(lows)/len(rows),sum(highs)/len(rows),sum(mids)/len(rows)

          m=stats(["Main 0-1 mi","Main 1-3 mi","Main 3-5 mi"])
          c=stats(["Centennial 0-1 mi","Centennial 1-3 mi","Centennial 3-5 mi"])
          b=stats(["Biomedical 0-1 mi","Biomedical 1-3 mi","Biomedical 3-5 mi"])
          print("Main:", m)
          print("Centennial:", c)
          print("Biomedical:", b)
          assert round(m[6],2)==868.53
          assert round(c[6],2)==868.80
          assert round(b[4])==828 and round(b[5])==934 and round(b[6])==881
          PY
      - name: Commit updated workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/ncsu-room-rent-audit.xlsx
          git rm -f .tmp/update-room-audit-all-bands.trigger
          git commit -m "Mirror article campus states in room audit workbook"
          git push
