name: Clarify housing rate chart title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-clarify-housing-rate-title.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify chart title and projection note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Projected rate increase from 2025–26 to 2026–27', 'Rate increase from 2025–26 to 2026–27*', 1)
          section_start = s.find('<section class="block housing-rate-change-block">')
          if section_start == -1:
              raise SystemExit('Housing rate section not found')
          section_end = s.find('</section>', section_start)
          if section_end == -1:
              raise SystemExit('Housing rate section end not found')
          note = '<div class="housing-rate-change-foot">*2026–27 rates are projected rates published by NC State University Housing.</div>\n  '
          section = s[section_start:section_end]
          if '*2026–27 rates are projected rates published by NC State University Housing.' not in section:
              s = s[:section_end] + note + s[section_end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clarify projected housing rate chart" || true
          git push
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git pull --rebase || true
          rm -f .github/workflows/chatgpt-clarify-housing-rate-title.yml
          git add .github/workflows/chatgpt-clarify-housing-rate-title.yml
          git commit -m "Remove one-time housing rate title workflow" || true
          git push || true
