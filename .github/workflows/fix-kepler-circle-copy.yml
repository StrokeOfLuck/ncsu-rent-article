name: Fix Kepler circle copy

on:
  push:
    paths:
      - .github/workflows/fix-kepler-circle-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix reference wording
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'The radius geometry is also kept as its own Kepler/GeoJSON source. In the listing audit maps, the 1-mile and 3-mile circles load as separate toggleable layers so the boundaries can be checked directly against the listings.'
          new = 'The radius geometry is also kept as its own Kepler/GeoJSON source. The 1-, 3-, and 5-mile boundaries and the 0–1, >1–3, and >3–5 mile bands are separate toggleable layers.'
          for name in ['references.html','scripts/add_kepler_distance_reference.py']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit reference wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html scripts/add_kepler_distance_reference.py
          git commit -m "Clarify 1 3 and 5 mile Kepler layers [skip ci]"
          git push
