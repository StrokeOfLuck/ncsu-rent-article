name: Fix overall rent summary math
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-overall-rent-summary.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix overall rent summary
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html references.html
          git commit -m "Fix overall rent summary calculation" || true
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          git pull --rebase
          rm -f .github/workflows/chatgpt-fix-overall-rent-summary.yml
          git add .github/workflows/chatgpt-fix-overall-rent-summary.yml
          git commit -m "Remove one-time rent summary workflow" || true
          git push
