name: Polish wages and inflation footer
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-polish-wages-inflation-footer.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer and remove redundant note text
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Commit and clean up workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-polish-wages-inflation-footer.yml
          git add index.html .github/workflows/chatgpt-polish-wages-inflation-footer.yml
          git diff --cached --quiet && exit 0
          git commit -m "Polish wages and inflation footer and remove redundant note"
          git push
