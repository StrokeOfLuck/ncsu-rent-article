name: Fix housing title background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-title-background-audit-rent-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove housing title background
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-fix-title-background-audit-rent-summary.yml
          git add index.html .github/workflows/chatgpt-fix-title-background-audit-rent-summary.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove housing title background in dark mode"
          git push
