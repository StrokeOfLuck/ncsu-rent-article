name: Rebuild utility audit 74-row source

on:
  push:
    branches: [main]
    paths:
      - '.tmp/rebuild-utility-74.trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install workbook dependency
        run: python -m pip install --quiet openpyxl

      - name: Build 74-row utility audit workbook
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from openpyxl import Workbook
          from openpyxl.styles import Font, PatternFill, Alignment
          from openpyxl.utils import get_column_letter

          root = Path('.')
          main_path = root / 'data/audits/ncsu-main-campus-private-bedroom-audit.csv'
          util_path = root / 'data/audits/ncsu-room-utilities-audit.csv'
          out_path = root / 'data/audits/ncsu-room-utilities-audit.xlsx'

          def read_csv(path):
              with path.open('r', encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          main = read_csv(main_path)
          util = [r for r in read_csv(util_path) if r.get('original_listing_url')]
          if len(main) != 74:
              raise SystemExit(f'Expected 74 source listings, got {len(main)}')
          if len(util) != 41:
              raise SystemExit(f'Expected 41 utility-positive listings, got {len(util)}')

          by_id = {r['listing_id']: r for r in util}
          if len(set(by_id) & {r['listing_id'] for r in main}) != 41:
              raise SystemExit('The 41 utility-positive IDs are not all present in the 74-row source population')

          all8 = [r for r in util if r.get('all_utilities_explicit_manual') == 'Yes']
          if len(all8) != 8:
              raise SystemExit(f'Expected 8 all-utilities rows, got {len(all8)}')
          internet6 = [r for r in all8 if r.get('internet_wifi_explicit') == 'Yes']
          if len(internet6) != 6:
              raise SystemExit(f'Expected 6 all-utilities + internet rows, got {len(internet6)}')

          wb = Workbook()
          ws = wb.active
          ws.title = 'Source population (74)'

          red = PatternFill('solid', fgColor='8B1F2D')
          header_fill = PatternFill('solid', fgColor='E9E4DB')
          green = PatternFill('solid', fgColor='E2F0D9')
          soft = PatternFill('solid', fgColor='F8F6F1')
          white_bold = Font(color='FFFFFF', bold=True, size=14)
          bold = Font(bold=True)

          ws.merge_cells('A1:L1')
          ws['A1'] = 'Utility Audit — Source Population (74)'
          ws['A1'].fill = red
          ws['A1'].font = white_bold

          ws.merge_cells('A2:L3')
          ws['A2'] = ('All 74 Main Campus private-bedroom listings in the article denominator. '
                      'The 41 listings that affirmatively establish at least one selected core utility as included '
                      'are highlighted green (41 of 74 = 55.4%).')
          ws['A2'].fill = soft
          ws['A2'].alignment = Alignment(wrap_text=True, vertical='top')

          headers = [
              'Listing ID','Listing','Advertised price','Rent low','Rent high','Midpoint',
              'Distance (mi)','Distance band','At least one core utility included?',
              'All utilities explicit?','Internet/Wi-Fi explicit?','Original listing URL'
          ]
          for c, h in enumerate(headers, 1):
              cell = ws.cell(5, c, h)
              cell.fill = header_fill
              cell.font = bold
              cell.alignment = Alignment(wrap_text=True)

          for i, r in enumerate(main, 6):
              u = by_id.get(r['listing_id'])
              vals = [
                  r['listing_id'], r['listing'], r['advertised_price'],
                  float(r['rent_low']), float(r['rent_high']), float(r['midpoint']),
                  float(r['main_distance_miles']), r['main_distance_band'],
                  'Yes' if u else 'No',
                  (u or {}).get('all_utilities_explicit_manual', 'No') or 'No',
                  (u or {}).get('internet_wifi_explicit', 'No') or 'No',
                  r['original_listing_url']
              ]
              for c, v in enumerate(vals, 1):
                  ws.cell(i, c, v)
                  ws.cell(i, c).alignment = Alignment(wrap_text=True, vertical='top')
              if u:
                  for c in range(1, 13):
                      ws.cell(i, c).fill = green

          ws.freeze_panes = 'A6'
          ws.auto_filter.ref = f'A5:L{5+len(main)}'
          widths = [16,42,16,12,12,12,13,15,24,20,20,55]
          for c, w in enumerate(widths, 1):
              ws.column_dimensions[get_column_letter(c)].width = w
          for row in range(6, 6+len(main)):
              for c in (4,5,6):
                  ws.cell(row, c).number_format = '$#,##0.00'
              ws.cell(row, 7).number_format = '0.000'

          def add_detail_sheet(title, rows, subtitle, highlight_internet=False):
              sh = wb.create_sheet(title)
              util_headers = list(rows[0].keys()) if rows else list(util[0].keys())
              last_col = get_column_letter(len(util_headers))
              sh.merge_cells(f'A1:{last_col}1')
              sh['A1'] = title
              sh['A1'].fill = red
              sh['A1'].font = white_bold
              sh.merge_cells(f'A2:{last_col}3')
              sh['A2'] = subtitle
              sh['A2'].fill = soft
              sh['A2'].alignment = Alignment(wrap_text=True, vertical='top')
              for c, h in enumerate(util_headers, 1):
                  cell = sh.cell(5, c, h)
                  cell.fill = header_fill
                  cell.font = bold
                  cell.alignment = Alignment(wrap_text=True)
              for i, r in enumerate(rows, 6):
                  for c, h in enumerate(util_headers, 1):
                      sh.cell(i, c, r.get(h, ''))
                      sh.cell(i, c).alignment = Alignment(wrap_text=True, vertical='top')
                  if highlight_internet and r.get('internet_wifi_explicit') == 'Yes':
                      for c in range(1, len(util_headers)+1):
                          sh.cell(i, c).fill = green
              sh.freeze_panes = 'A6'
              sh.auto_filter.ref = f'A5:{last_col}{5+len(rows)}'
              for c in range(1, len(util_headers)+1):
                  sh.column_dimensions[get_column_letter(c)].width = 20
              for c, h in enumerate(util_headers, 1):
                  if h in {'listing','portal_utility_line_items_verbatim','description_utility_wording_verbatim',
                           'all_utilities_exact_wording','all_utilities_manual_review_note',
                           'internet_wifi_evidence','original_listing_url'}:
                      sh.column_dimensions[get_column_letter(c)].width = 48
              return sh

          add_detail_sheet(
              'Utility evidence (41)', util,
              'The 41 of 74 source listings with affirmative evidence that at least one selected core utility is included.'
          )
          add_detail_sheet(
              'All utilities stated (8)', all8,
              'Eight of 74 listings explicitly state that all utilities are included. '
              'The six that also explicitly include internet/Wi-Fi are highlighted green.',
              highlight_internet=True
          )

          wb.save(out_path)
          print('Built', out_path, 'with 74 source rows and 41 green-highlighted utility-positive rows.')
          PY

      - name: Validate workbook
        run: |
          unzip -t data/audits/ncsu-room-utilities-audit.xlsx
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook('data/audits/ncsu-room-utilities-audit.xlsx', read_only=False)
          assert wb.sheetnames[:3] == ['Source population (74)', 'Utility evidence (41)', 'All utilities stated (8)']
          ws = wb['Source population (74)']
          assert ws.max_row >= 79
          yes = 0
          green = 0
          for r in range(6, 80):
              if ws.cell(r, 9).value == 'Yes':
                  yes += 1
                  if ws.cell(r, 1).fill.fgColor.rgb in ('00E2F0D9','FFE2F0D9'):
                      green += 1
          assert yes == 41, yes
          assert green == 41, green
          print('Verified 74-row source population with 41 green-highlighted rows.')
          PY

      - name: Commit rebuilt workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/ncsu-room-utilities-audit.xlsx
          git rm -f .tmp/rebuild-utility-74.trigger
          git commit -m "Rebuild utility audit with 74-row source population"
          git push
