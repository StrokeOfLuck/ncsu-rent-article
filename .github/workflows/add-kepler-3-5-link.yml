name: Add 3-5 mile Kepler map

on:
  push:
    paths:
      - .github/workflows/add-kepler-3-5-link.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3-5 mile Kepler map and update reference
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, math
          from pathlib import Path

          LAT, LON = 35.77951, -78.68168
          EARTH_MI = 3958.7613

          def haversine(lat, lon):
              p1, p2 = math.radians(LAT), math.radians(lat)
              dp = math.radians(lat-LAT)
              dl = math.radians(lon-LON)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*EARTH_MI*math.asin(math.sqrt(a))

          def circle(radius_miles, steps=180):
              lat1 = math.radians(LAT); lon1 = math.radians(LON); d = radius_miles/EARTH_MI
              pts=[]
              for i in range(steps+1):
                  b = math.radians(360*i/steps)
                  lat2 = math.asin(math.sin(lat1)*math.cos(d)+math.cos(lat1)*math.sin(d)*math.cos(b))
                  lon2 = lon1 + math.atan2(math.sin(b)*math.sin(d)*math.cos(lat1), math.cos(d)-math.sin(lat1)*math.sin(lat2))
                  pts.append([round(math.degrees(lon2),7), round(math.degrees(lat2),7)])
              return pts

          rows=[]
          with open('data/ncsu-properties.csv', newline='', encoding='utf-8') as f:
              for r in csv.DictReader(f):
                  try:
                      lat=float(r['latitude']); lon=float(r['longitude'])
                  except (TypeError, ValueError):
                      continue
                  if str(r.get('active','')).lower() not in ('true','1','yes'):
                      continue
                  d=haversine(lat,lon)
                  if 3 < d <= 5:
                      nearest=min(d-3,5-d)*5280
                      rows.append({
                          'property_name':r.get('name',''), 'address':r.get('street_address',''),
                          'listing_latitude':lat, 'listing_longitude':lon,
                          'campus_latitude':LAT, 'campus_longitude':LON,
                          'distance_from_reference_miles':round(d,6),
                          'distance_to_nearest_boundary_feet':round(nearest,1),
                          'boundary_note':f"{nearest:,.0f} ft from nearest 3/5-mile boundary",
                          'listing_url':r.get('listing_url','')
                      })
          rows.sort(key=lambda x:x['distance_from_reference_miles'])
          if len(rows) != 26:
              raise SystemExit(f'Expected 26 >3-5 mile listings, found {len(rows)}')

          csv_path=Path('data/kepler/ncsu-rent-main-campus_3-5mi-distance.csv')
          with csv_path.open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys())); w.writeheader(); w.writerows(rows)

          fields=[
              {'name':'property_name','type':'string','format':'','analyzerType':'STRING'},
              {'name':'address','type':'string','format':'','analyzerType':'STRING'},
              {'name':'listing_latitude','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'listing_longitude','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'campus_latitude','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'campus_longitude','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'distance_from_reference_miles','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'distance_to_nearest_boundary_feet','type':'real','format':'','analyzerType':'FLOAT'},
              {'name':'boundary_note','type':'string','format':'','analyzerType':'STRING'},
              {'name':'listing_url','type':'string','format':'','analyzerType':'STRING'}
          ]
          all_data=[[r[k] for k in [f['name'] for f in fields]] for r in rows]
          ring3=circle(3); ring5=circle(5)
          band={'type':'Polygon','coordinates':[ring5,list(reversed(ring3))]}

          def geo_dataset(i,label,geom,color,kind,value):
              return {'version':'v1','data':{'id':i,'label':label,'color':color,
                  'allData':[[label,value,'Straight-line geodesic distance from Main Campus reference point',json.dumps(geom,separators=(',',':'))]],
                  'fields':[{'name':'label','type':'string','format':'','analyzerType':'STRING'},
                            {'name':kind,'type':'string','format':'','analyzerType':'STRING'},
                            {'name':'distance_definition','type':'string','format':'','analyzerType':'STRING'},
                            {'name':'_geojson','type':'geojson','format':'','analyzerType':'GEOJSON'}]}}

          datasets=[
              {'version':'v1','data':{'id':'main_3_5','label':'Main Campus >3–5 mile listings','color':[126,87,194],'allData':all_data,'fields':fields}},
              {'version':'v1','data':{'id':'campus_reference','label':'Main Campus reference point','color':[30,30,30],
                 'allData':[['Main Campus distance reference',LAT,LON,'Reference point used by the Haversine calculations']],
                 'fields':[{'name':'label','type':'string','format':'','analyzerType':'STRING'},
                           {'name':'latitude','type':'real','format':'','analyzerType':'FLOAT'},
                           {'name':'longitude','type':'real','format':'','analyzerType':'FLOAT'},
                           {'name':'definition','type':'string','format':'','analyzerType':'STRING'}]}},
              geo_dataset('band_3_5','>3–5 mile band',band,[126,87,194],'band','>3–5 miles'),
              geo_dataset('radius_3','3-mile boundary',{'type':'LineString','coordinates':ring3},[64,145,218],'radius_miles','3'),
              geo_dataset('radius_5','5-mile boundary',{'type':'LineString','coordinates':ring5},[126,87,194],'radius_miles','5')
          ]

          def geo_layer(i,label,color,fill=False):
              return {'id':i+'_layer','type':'geojson','config':{'dataId':i,'label':label,'color':color,'columns':{'geojson':'_geojson'},'isVisible':True,
                  'visConfig':{'opacity':0.10 if fill else 0.95,'thickness':1 if fill else 3,'stroked':not fill,'filled':fill,'enable3d':False,'wireframe':False},'hidden':False},
                  'visualChannels':{'colorField':None,'colorScale':'quantile','sizeField':None,'sizeScale':'linear','heightField':None,'heightScale':'linear','radiusField':None,'radiusScale':'linear'}}

          layers=[
              geo_layer('band_3_5','>3–5 mile band',[126,87,194],True),
              {'id':'listing_points','type':'point','config':{'dataId':'main_3_5','label':'>3–5 mile listings','color':[126,87,194],
                 'columns':{'lat':'listing_latitude','lng':'listing_longitude','altitude':None},'isVisible':True,
                 'visConfig':{'radius':5,'fixedRadius':False,'opacity':0.9,'outline':True,'thickness':1,'strokeColor':[255,255,255],'filled':True},'hidden':False,'textLabel':[]},
                 'visualChannels':{'colorField':None,'colorScale':'quantile','strokeColorField':None,'strokeColorScale':'quantile','sizeField':None,'sizeScale':'linear'}},
              {'id':'campus_point','type':'point','config':{'dataId':'campus_reference','label':'Main Campus reference point','color':[25,25,25],
                 'columns':{'lat':'latitude','lng':'longitude','altitude':None},'isVisible':True,
                 'visConfig':{'radius':10,'fixedRadius':False,'opacity':1,'outline':True,'thickness':1,'strokeColor':[255,255,255],'filled':True},'hidden':False,'textLabel':[]},
                 'visualChannels':{'colorField':None,'colorScale':'quantile','strokeColorField':None,'strokeColorScale':'quantile','sizeField':None,'sizeScale':'linear'}},
              geo_layer('radius_5','5-mile boundary',[126,87,194],False),
              geo_layer('radius_3','3-mile boundary',[64,145,218],False)
          ]

          config={'version':'v1','config':{'visState':{'filters':[],'layers':layers,
              'interactionConfig':{'tooltip':{'fieldsToShow':{
                  'main_3_5':[{'name':'property_name','format':None},{'name':'address','format':None},{'name':'distance_from_reference_miles','format':None},{'name':'boundary_note','format':None},{'name':'listing_url','format':None}],
                  'campus_reference':[{'name':'label','format':None},{'name':'definition','format':None}],
                  'band_3_5':[{'name':'label','format':None},{'name':'band','format':None}],
                  'radius_3':[{'name':'label','format':None}], 'radius_5':[{'name':'label','format':None}]},'compareMode':False,'compareType':'absolute','enabled':True},
                  'brush':{'size':0.5,'enabled':False},'geocoder':{'enabled':False},'coordinate':{'enabled':True}},
              'layerBlending':'normal','splitMaps':[],'animationConfig':{'currentTime':None,'speed':1}},
              'mapState':{'bearing':0,'dragRotate':False,'latitude':LAT,'longitude':LON,'pitch':0,'zoom':10.45,'isSplit':False},
              'mapStyle':{'styleType':'light','topLayerGroups':{},'visibleLayerGroups':{'label':True,'road':True,'border':False,'building':True,'water':True,'land':True,'3d building':False},'threeDBuildingColor':[9.665,17.183,31.144],'mapStyles':{}}}}
          out={'datasets':datasets,'config':config,'info':{'app':'kepler.gl','title':'NC State Main Campus >3–5 mile Distance Audit','description':'26 listings in the non-overlapping >3–5 mile band, with the shaded band and 3- and 5-mile boundaries as separate toggleable layers.'}}
          Path('data/kepler/ncsu-rent-main-campus_3-5mi-distance.kepler.gl.json').write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          link='https://kepler.gl/demo/map?mapUrl=https%3A%2F%2Fraw.githubusercontent.com%2FStrokeOfLuck%2Fncsu-rent-article%2Fmain%2Fdata%2Fkepler%2Fncsu-rent-main-campus_3-5mi-distance.kepler.gl.json'
          newrow=f'''          <div class="meta-label">&gt;3–5 miles</div>\n          <div class="meta-value"><a href="{link}" target="_blank" rel="noopener noreferrer">Kepler</a> · 26 listings. The shaded &gt;3–5 mile band, 3-mile boundary, 5-mile boundary, listing points, and Main Campus reference point are separate toggleable layers.</div>\n\n'''
          for fname in ['references.html','scripts/add_kepler_distance_reference.py']:
              p=Path(fname)
              s=p.read_text(encoding='utf-8')
              if '<div class="meta-label">&gt;3–5 miles</div>' not in s:
                  marker='          <div class="meta-label">Distance circles</div>'
                  s=s.replace(marker,newrow+marker,1)
              s=s.replace('The 1-mile and 3-mile circles load as separate toggleable layers so the boundaries can be checked directly against the listings.','The 1-, 3-, and 5-mile circles and the three non-overlapping bands are separate toggleable layers so the boundaries can be checked directly against the listings.')
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated 3-5 mile map and reference link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kepler/ncsu-rent-main-campus_3-5mi-distance.csv data/kepler/ncsu-rent-main-campus_3-5mi-distance.kepler.gl.json references.html scripts/add_kepler_distance_reference.py
          git commit -m "Add 3-5 mile Kepler audit link [skip ci]"
          git push
