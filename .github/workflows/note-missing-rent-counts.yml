name: Note missing rent counts

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-reference-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update references table
        run: python scripts/note-missing-rent-counts.py
      - name: Commit update and remove temporary files
        run: |
          rm .github/workflows/note-missing-rent-counts.yml
          rm scripts/note-missing-rent-counts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html .github/workflows/note-missing-rent-counts.yml scripts/note-missing-rent-counts.py
          git commit -m "Clarify missing numeric rent counts"
          git push
