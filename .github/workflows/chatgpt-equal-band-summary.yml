name: Equal-weight distance band summary

on:
  push:
    paths:
      - '.github/workflows/chatgpt-equal-band-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch article and references
        run: |
          python - <<'PY'
          from pathlib import Path

          ip = Path("index.html")
          rp = Path("references.html")
          index = ip.read_text(encoding="utf-8")
          refs = rp.read_text(encoding="utf-8")

          if "function overallDistanceBandSummary(campusKey)" not in index:
              helper = """function overallDistanceBandSummary(campusKey) {
            const bands = [[0,1],[1,3],[3,5]];
            const per = [];
            const whole = [];
            for (const [inner, outer] of bands) {
              const audit = getDistanceBandAudit(campusKey, inner, outer);
              per.push(audit.perStats);
              whole.push(audit.wholeStats);
            }
            return {
              perOverall: combinedStats(per),
              wholeOverall: combinedStats(whole)
            };
          }

          """
              marker = "function overallAllCampusesSummary() {"
              assert marker in index
              index = index.replace(marker, helper + marker, 1)

          old = "  const summary = overallAllCampusesSummary();\n"
          new = "  const summary = overallAllCampusesSummary();\n  const bandSummary = overallDistanceBandSummary(currentCampusKey);\n"
          if new not in index:
              assert old in index
              index = index.replace(old, new, 1)

          old_meta = """  document.getElementById("combinedRentMeta").textContent =
              "Main, Centennial and Biomedical Campus · all unique listings across the displayed 1-, 3- and 5-mile views, counted once";
          """
          new_meta = """  document.getElementById("combinedRentMeta").textContent =
              `${campuses[currentCampusKey].label} · equal-weight average of the 0–1, >1–3 and >3–5 mile distance-band means`;
          """
          if new_meta not in index:
              assert old_meta in index
              index = index.replace(old_meta, new_meta, 1)

          for old_line, new_line in [
              ('combinedPerOverall").textContent = summary.perOverall.display;', 'combinedPerOverall").textContent = bandSummary.perOverall.display;'),
              ('combinedPerMid").textContent = money(summary.perOverall.midpoint);', 'combinedPerMid").textContent = money(bandSummary.perOverall.midpoint);'),
              ('combinedWholeOverall").textContent = summary.wholeOverall.display;', 'combinedWholeOverall").textContent = bandSummary.wholeOverall.display;'),
              ('combinedWholeMid").textContent = money(summary.wholeOverall.midpoint);', 'combinedWholeMid").textContent = money(bandSummary.wholeOverall.midpoint);')
          ]:
              if new_line not in index:
                  assert old_line in index
                  index = index.replace(old_line, new_line, 1)

          refs = refs.replace(
              "<strong>Worked calculation for the combined rent summary:</strong>",
              "<strong>Worked calculation for the affordability visualizer:</strong>", 1
          )

          if "Worked calculation for the selected-campus off-campus summary card" not in refs:
              note = """        <div class="use-note">
                    <strong>Worked calculation for the selected-campus off-campus summary card:</strong> The card beneath the distance-band table gives the three non-overlapping bands equal weight. For each pricing type: (0–1 mile mean + >1–3 mile mean + >3–5 mile mean) ÷ 3. The same calculation is done separately for the low and high rent means; the midpoint is halfway between those results. Bands are not weighted by their number of listings.<br><br>
                    <strong>Main Campus check:</strong> Per-bedroom low = ($827.35 + $818.17 + $890.00) ÷ 3 = <strong>$845.17</strong>; high = ($928.20 + $955.02 + $920.00) ÷ 3 = <strong>$934.41</strong>; midpoint = <strong>$889.79</strong>. Article display: <strong>$845–$934; midpoint $890</strong>.<br>
                    Whole-unit low = ($1,855.18 + $1,597.06 + $1,560.19) ÷ 3 = <strong>$1,670.81</strong>; high = ($2,102.88 + $1,741.68 + $1,661.19) ÷ 3 = <strong>$1,835.25</strong>; midpoint = <strong>$1,753.03</strong>. Article display: <strong>$1,671–$1,835; midpoint $1,753</strong>.<br><br>
                    <strong>Other campus displays:</strong> Centennial Campus = <strong>$835–$945 per bedroom (midpoint $890)</strong> and <strong>$1,657–$1,833 whole unit (midpoint $1,745)</strong>. Centennial Biomedical Campus = <strong>$865–$1,066 per bedroom (midpoint $966)</strong> and <strong>$1,904–$2,003 whole unit (midpoint $1,954)</strong>. The individual band sums, counts and means used for these checks are in the table immediately below.
                  </div>

          """
              marker = '        <div class="band-math-wrap">'
              assert marker in refs
              refs = refs.replace(marker, note + marker, 1)

          ip.write_text(index, encoding="utf-8")
          rp.write_text(refs, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git add index.html references.html
          git commit -m "Use equal-weight distance bands for off-campus summary [skip ci]"
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/chatgpt-equal-band-summary.yml
          git commit -m "Remove one-time equal-band summary workflow [skip ci]"
          git push
