name: Equal-weight distance band summary

on:
  push:
    paths:
      - '.github/workflows/chatgpt-equal-band-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch article and references
        run: |
          echo '' | base64 -d > /tmp/patch_equal_band_summary.py
          python /tmp/patch_equal_band_summary.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html references.html
          git commit -m "Use equal-weight distance bands for off-campus summary [skip ci]" || exit 0
          git push
      - name: Remove one-time workflow
        if: always()
        run: |
          git pull --rebase
          git rm .github/workflows/chatgpt-equal-band-summary.yml
          git commit -m "Remove one-time equal-band summary workflow [skip ci]"
          git push
