name: Float rental map legend
on:
  push:
    paths:
      - .github/workflows/map-legend-overlay.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update rental map legend layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_tag = '/* Floating rental map key */'
          if css_tag not in s:
              css = r'''
          /* Floating rental map key */
          .map-stage {
            position:relative;
          }

          .map-stage .legend-row {
            position:absolute;
            z-index:4;
            top:14px;
            left:14px;
            width:min(220px, calc(100% - 28px));
            margin:0;
            padding:10px 12px;
            display:flex;
            flex-direction:column;
            flex-wrap:nowrap;
            align-items:stretch;
            gap:7px;
            color:#3f3b36;
            background:rgba(255,255,255,.94);
            border:1px solid rgba(221,217,209,.95);
            border-radius:4px;
            box-shadow:0 3px 14px rgba(0,0,0,.12);
            backdrop-filter:blur(3px);
          }

          .map-stage .legend-item {
            gap:7px;
            line-height:1.25;
          }

          .map-stage .info-note {
            margin-top:2px;
            padding-top:7px;
            border-top:1px solid var(--line);
            color:#5d5851;
          }

          .campus-panel .price-snapshot-note {
            margin-top:8px;
            padding-top:8px;
            border-top:1px solid var(--line);
            color:#5d5851;
            font-size:9.5px;
            line-height:1.35;
            text-align:right;
          }

          @media (max-width:980px) {
            .campus-panel .price-snapshot-note {
              text-align:left;
            }
          }

          @media (max-width:720px) {
            .map-stage .legend-row {
              top:10px;
              left:10px;
              width:174px;
              padding:9px 10px;
              gap:6px;
              font-size:9.5px;
            }

            .map-stage .info-note {
              font-size:9px;
              line-height:1.35;
            }
          }
          '''
              s = s.replace('</style>', css + '\n</style>', 1)

          old_legend = '''  <div id="map"></div>

            <div class="legend-row">
              <div class="legend-item"><span class="dot bed"></span>Per bedroom listing</div>
              <div class="legend-item"><span class="dot unit"></span>Whole unit listing</div>
              <div class="legend-item"><span class="diamond campus-ref">◆</span>Campus reference point</div>
              <div class="legend-item"><span class="box perim"></span>Campus perimeter</div>
              <div class="legend-item"><span class="box bldg"></span>NC State building</div>
              <div class="info-note">Click a rental to open the original NC State listing.</div>
              <div class="info-note price-snapshot-note"><strong>Prices reflect listings collected Sept. 9, 2026. Live listings may have changed.</strong></div>
            </div>
          '''

          new_legend = '''  <div class="map-stage">
              <div id="map"></div>

              <div class="legend-row" aria-label="Map legend">
                <div class="legend-item"><span class="dot bed"></span>Per bedroom listing</div>
                <div class="legend-item"><span class="dot unit"></span>Whole unit listing</div>
                <div class="legend-item"><span class="diamond campus-ref">◆</span>Campus reference point</div>
                <div class="legend-item"><span class="box perim"></span>Campus perimeter</div>
                <div class="legend-item"><span class="box bldg"></span>NC State building</div>
                <div class="info-note">Click a rental to open the original NC State listing.</div>
              </div>
            </div>
          '''

          # The source block has two-space indentation. Remove the extra script indentation
          # introduced above before matching it against index.html.
          old_legend = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_legend.splitlines()) + '\n'
          new_legend = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_legend.splitlines()) + '\n'

          if old_legend not in s:
              raise SystemExit('Expected map legend block was not found')
          s = s.replace(old_legend, new_legend, 1)

          precinct = '      <div id="precinct-note"></div>\n'
          price_note = '      <div id="precinct-note"></div>\n      <div class="info-note price-snapshot-note"><strong>Prices reflect listings collected Sept. 9, 2026. Live listings may have changed.</strong></div>\n'
          if precinct not in s:
              raise SystemExit('Expected campus panel anchor was not found')
          s = s.replace(precinct, price_note, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/map-legend-overlay.yml
          git add index.html .github/workflows/map-legend-overlay.yml
          git commit -m "Float map legend and move listing date note [skip ci]"
          git push
