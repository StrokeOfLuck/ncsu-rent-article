name: Keep displayed rent math checkable
on:
  push:
    paths:
      - .github/fix-visible-rent-midpoint.py
      - .github/workflows/fix-visible-rent-midpoint.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply displayed rent midpoint fix
        run: python .github/fix-visible-rent-midpoint.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make displayed rent math checkable"
            git push
          fi
