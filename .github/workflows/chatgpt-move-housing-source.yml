name: Move housing source link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-move-housing-source.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move cost-of-attendance source into housing budget section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          source = '''          <span class="combined-source">NC State housing benchmark: <a href="https://studentservices.ncsu.edu/finances/estimated-cost-of-attendance/undergraduate-student-estimated-cost-of-attendance/" target="_blank" rel="noopener noreferrer">official cost of attendance</a></span>\n'''
          if source not in text:
              raise SystemExit('Expected housing source link not found in combined summary')
          text = text.replace(source, '', 1)

          heading = '''          <div class="housing-monthly-title">Official NC State housing budgets</div>'''
          replacement = '''          <div class="housing-monthly-title" style="display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;">
            <span>Official NC State housing budgets</span>
            <span class="combined-source" style="font-weight:400;">Source: <a href="https://studentservices.ncsu.edu/finances/estimated-cost-of-attendance/undergraduate-student-estimated-cost-of-attendance/" target="_blank" rel="noopener noreferrer">NC State Cost of Attendance</a></span>
          </div>'''
          if heading not in text:
              raise SystemExit('Expected Official NC State housing budgets heading not found')
          text = text.replace(heading, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move housing source into budget section"
          git push
