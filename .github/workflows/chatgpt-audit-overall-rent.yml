name: Audit overall rent calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-audit-overall-rent.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Calculate overall rent methods from exact frontend data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math, re

          s = Path('index.html').read_text(encoding='utf-8')
          rentals_m = re.search(r'const rentals = (\[.*?\]);\nconst campuses = ', s, re.S)
          campuses_m = re.search(r'const campuses = (\{.*?\});\nconst campusPerimeters = ', s, re.S)
          if not rentals_m or not campuses_m:
              raise SystemExit('Could not extract frontend datasets')

          rentals = json.loads(rentals_m.group(1))
          campuses = json.loads(campuses_m.group(1))
          radii = [1, 3, 5]

          def hav(lat1, lon1, lat2, lon2):
              R = 3958.7613
              rad = math.radians
              p1, p2 = rad(lat1), rad(lat2)
              dp, dl = rad(lat2-lat1), rad(lon2-lon1)
              a = math.sin(dp/2)**2 + math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))

          def mean(vals):
              vals = [v for v in vals if v is not None]
              return sum(vals)/len(vals) if vals else None

          def stats(rows):
              lo = mean([x.get('rent_low') for x in rows])
              hi = mean([x.get('rent_high') for x in rows])
              return len(rows), lo, hi, mean([lo, hi])

          per_view = []
          whole_view = []
          all_appearances = []
          union_ids_all_radii = set()

          print('VIEW RESULTS')
          for key, c in campuses.items():
              for r in radii:
                  near = [x for x in rentals if hav(c['lat'], c['lon'], x['lat'], x['lon']) <= r]
                  all_appearances.extend((key, r, x) for x in near)
                  union_ids_all_radii.update(x['site_id'] for x in near)
                  per = [x for x in near if x['pricing_type'] == 'Per bedroom']
                  whole = [x for x in near if x['pricing_type'] == 'Whole unit']
                  pn, plo, phi, pmid = stats(per)
                  wn, wlo, whi, wmid = stats(whole)
                  per_view.append((pn, plo, phi))
                  whole_view.append((wn, wlo, whi))
                  print(f'{key:10s} <= {r} mi | per n={pn:3d}: ${plo:.2f}-${phi:.2f} | whole n={wn:3d}: ${wlo:.2f}-${whi:.2f}')

          eq_per_lo = mean([x[1] for x in per_view])
          eq_per_hi = mean([x[2] for x in per_view])
          eq_whole_lo = mean([x[1] for x in whole_view])
          eq_whole_hi = mean([x[2] for x in whole_view])
          print('\nCURRENT EQUAL-WEIGHT NINE-VIEW METHOD')
          print(f'Per bedroom: ${eq_per_lo:.4f}-${eq_per_hi:.4f}, midpoint ${(eq_per_lo+eq_per_hi)/2:.4f}')
          print(f'Whole unit: ${eq_whole_lo:.4f}-${eq_whole_hi:.4f}, midpoint ${(eq_whole_lo+eq_whole_hi)/2:.4f}')

          appearance_rows = [x for _, _, x in all_appearances]
          appearance_per = [x for x in appearance_rows if x['pricing_type'] == 'Per bedroom']
          appearance_whole = [x for x in appearance_rows if x['pricing_type'] == 'Whole unit']
          print('\nALL NINE VIEWS POOLED AS LISTING APPEARANCES (DUPLICATES COUNT AGAIN)')
          for label, rows in [('Per bedroom', appearance_per), ('Whole unit', appearance_whole)]:
              n, lo, hi, mid = stats(rows)
              print(f'{label}: appearances n={n}, ${lo:.4f}-${hi:.4f}, midpoint ${mid:.4f}')

          union5 = [x for x in rentals if any(hav(c['lat'], c['lon'], x['lat'], x['lon']) <= 5 for c in campuses.values())]
          union5_ids = {x['site_id'] for x in union5}
          print('\nUNIQUE LISTINGS WITHIN 5 MI OF AT LEAST ONE CAMPUS (EACH LISTING ONCE)')
          for label in ['Per bedroom', 'Whole unit']:
              rows = [x for x in union5 if x['pricing_type'] == label]
              n, lo, hi, mid = stats(rows)
              print(f'{label}: unique n={n}, ${lo:.4f}-${hi:.4f}, midpoint ${mid:.4f}')

          print('\nSET CHECK')
          print(f'Unique IDs found across all 1/3/5-mile views: {len(union_ids_all_radii)}')
          print(f'Unique IDs in union of the three 5-mile views: {len(union5_ids)}')
          print(f'Sets identical: {union_ids_all_radii == union5_ids}')
          PY
      - name: Remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-audit-overall-rent.yml
          git add .github/workflows/chatgpt-audit-overall-rent.yml
          git commit -m "Remove one-time overall rent calculation audit" || exit 0
          git push
