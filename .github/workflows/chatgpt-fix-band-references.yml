name: Repair distance-band reference math
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-fix-band-references.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair reference math
        run: node .github/scripts/fix-band-references.js
      - name: Commit references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html
          git commit -m "Repair non-overlapping distance band reference math" || true
          git push
      - name: Remove one-time patch files
        run: |
          git pull --rebase
          rm -f .github/workflows/chatgpt-fix-band-references.yml .github/scripts/fix-band-references.js
          git add .github/workflows/chatgpt-fix-band-references.yml .github/scripts/fix-band-references.js
          git commit -m "Remove one-time reference band math patch" || true
          git push
