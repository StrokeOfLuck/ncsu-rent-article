name: Move room audit link
on:
  push:
    paths:
      - .github/move-room-audit-link.py
      - .github/workflows/move-room-audit-link.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move room audit link
        run: python .github/move-room-audit-link.py
      - name: Commit layout update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add draft-story-0915.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Move room audit link beside winter break control"
            git push
          fi
