name: Add article link to references header

on:
  push:
    paths:
      - '.github/workflows/add-references-article-link.yml'

permissions:
  contents: write

jobs:
  patch-reference-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link references header back to article
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('references.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="kicker">NCSU rent article</div>'
          new = '<div class="kicker"><a href="index.html" style="color: inherit; text-decoration: underline; text-underline-offset: 3px;">NCSU rent article</a></div>'

          if new in text:
              print('Article link is already present.')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Added article link.')
          else:
              raise SystemExit('Expected references header was not found.')
          PY
      - name: Commit change
        run: |
          if git diff --quiet -- references.html; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references.html
          git commit -m 'Add article link to references header'
          git push
