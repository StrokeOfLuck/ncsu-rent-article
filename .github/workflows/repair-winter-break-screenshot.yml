name: Repair winter break screenshot

on:
  push:
    branches: [main]
    paths:
      - '.tmp/repair-winter-break.trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild exact winter break screenshot
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/winter-source.b64.part* | tr -d '\n\r ' | base64 --decode > assets/references/ncsu-winter-break-costs-2025-26.png
          echo "432f3efa6505b2ad14f5cf396d14facc837dad1cd7bf787f54053ab045e1c9c1  assets/references/ncsu-winter-break-costs-2025-26.png" | sha256sum -c -
          file assets/references/ncsu-winter-break-costs-2025-26.png
      - name: Commit repaired source image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/references/ncsu-winter-break-costs-2025-26.png
          git rm -f .tmp/winter-source.b64.part* .tmp/repair-winter-break.trigger
          git commit -m "Repair winter break source screenshot bytes"
          git push
