name: Clarify missing rent treatment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clarify-missing-rent-treatment.yml

permissions:
  contents: write

jobs:
  update-reference-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update missing-rent explanation
        shell: python
        run: |
          from pathlib import Path
          path = Path('references.html')
          text = path.read_text(encoding='utf-8')
          old = 'It remains in each band’s property total but is excluded from rent sums and means and is not treated as $0.'
          new = 'It is treated as <strong>missing / non-numeric rent data</strong>: it remains in each band’s property total, contributes nothing to the rent sum, is excluded from the rent-average denominator, and is not treated as $0.'
          if old not in text:
              raise SystemExit('Expected explanation text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit update and remove one-shot workflow
        run: |
          rm .github/workflows/clarify-missing-rent-treatment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html .github/workflows/clarify-missing-rent-treatment.yml
          git commit -m "Clarify treatment of missing rent values"
          git push
