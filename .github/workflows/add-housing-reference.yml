name: Add NC State housing rates reference

on:
  push:
    paths:
      - '.github/workflows/add-housing-reference.yml'

permissions:
  contents: write

jobs:
  patch-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add housing rates reference
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('references.html')
          s = p.read_text(encoding='utf-8')
          ref_id = 'id="ncsu-housing-rates-2026-27"'

          if ref_id not in s:
              block = r'''

    <article class="ref" id="ncsu-housing-rates-2026-27">
      <div class="ref-head">
        <div>
          <div class="ref-no">Reference 15</div>
          <div class="ref-title">NC State University Housing — 2025–26 and Projected 2026–27 Housing Rates</div>
        </div>
        <div class="tags">
          <span class="tag">Primary source</span>
          <span class="tag">NC State</span>
          <span class="tag">On-campus housing</span>
          <span class="tag">Housing rates</span>
        </div>
      </div>

      <div class="ref-body">
        <div class="meta-grid">
          <div class="meta-label">Organization</div>
          <div class="meta-value">NC State University Housing</div>

          <div class="meta-label">Page title</div>
          <div class="meta-value">Costs</div>

          <div class="meta-label">URL</div>
          <div class="meta-value"><a href="https://housing.dasa.ncsu.edu/residential-communities/costs/" target="_blank" rel="noopener noreferrer">NC State University Housing — Costs</a></div>

          <div class="meta-label">Rates shown</div>
          <div class="meta-value">2025–2026 semester rates and projected 2026–2027 semester rates</div>

          <div class="meta-label">Accessed</div>
          <div class="meta-value">Sept. 10, 2026</div>

          <div class="meta-label">Source type</div>
          <div class="meta-value">Official university housing rate schedule</div>
        </div>

        <hr class="rule">

        <h2>Reference citation</h2>
        <div class="citation">
          North Carolina State University, University Housing. “Costs.” Academic-year housing rates, including 2025–2026 rates and projected 2026–2027 rates. Accessed Sept. 10, 2026.
        </div>

        <hr class="rule">

        <h2>Rates visible in saved evidence</h2>
        <div class="facts">
          <div class="fact"><div class="fact-label">Double</div><div class="fact-value"><strong>$3,800</strong> (2025–26); <strong>$3,970 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">Single</div><div class="fact-value"><strong>$4,275</strong> (2025–26); <strong>$4,600 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">Wolf Village/Wolf Ridge — 1 bedroom/studio</div><div class="fact-value"><strong>$5,000</strong> (2025–26); <strong>$5,375 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">Wolf Village/Wolf Ridge — 2, 3 or 4 bedrooms</div><div class="fact-value"><strong>$4,500</strong> (2025–26); <strong>$4,780 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">E.S. King — 1-bedroom undergraduate double</div><div class="fact-value"><strong>$4,125</strong> (2025–26); <strong>$4,350 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">E.S. King/Western Manor — studio</div><div class="fact-value"><strong>$3,900</strong> (2025–26); <strong>$4,150 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">E.S. King/Western Manor — 1 bedroom</div><div class="fact-value"><strong>$4,375</strong> (2025–26); <strong>$4,600 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">E.S. King/Western Manor — 2 bedroom</div><div class="fact-value"><strong>$5,000</strong> (2025–26); <strong>$5,300 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">Coastal Quarters — single</div><div class="fact-value"><strong>$4,225</strong> (2025–26); <strong>$4,350 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">Coastal Quarters — double</div><div class="fact-value"><strong>$3,950</strong> (2025–26); <strong>$4,025 projected</strong> (2026–27).</div></div>
          <div class="fact"><div class="fact-label">ResNet required fee</div><div class="fact-value"><strong>$150</strong> in both columns. Coastal Quarters residents also pay a <strong>$150 communication fee</strong>.</div></div>
        </div>

        <div class="use-note">
          <strong>Article use:</strong> Official on-campus housing benchmark for comparison with rents advertised near NC State. The page says the listed housing rates are charged <strong>by semester</strong>; 2026–27 amounts shown are <strong>projected</strong>.
        </div>

        <hr class="rule">

        <h2>Saved evidence</h2>
        <div class="evidence">
          <img src="assets/references/ncsu-university-housing-costs-2026-09-10.webp" alt="NC State University Housing Costs page showing semester housing rates for 2025–26 and projected 2026–27">
          <div class="caption">Screenshot saved Sept. 10, 2026. The linked NC State Housing page is the source of record.</div>
        </div>
      </div>
    </article>
'''
              marker = '\n  </div>\n</main>\n</body>\n</html>'
              if marker not in s:
                  raise SystemExit('Could not find references closing marker')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/add-housing-reference.yml').unlink(missing_ok=True)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references.html .github/workflows/add-housing-reference.yml
          git commit -m 'Add NC State University Housing rates reference [skip ci]' || exit 0
          git push
