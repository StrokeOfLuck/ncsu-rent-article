name: Rebuild room audit XLSX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-room-audit-xlsx.yml'
      - 'scripts/rebuild_room_xlsx_stdlib.py'
      - 'data/reviewed-rentals.json'
      - 'data/audits/rebuild-room-audit.trigger'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild standard XLSX
        run: python scripts/rebuild_room_xlsx_stdlib.py
      - name: Verify ZIP package
        run: unzip -t data/audits/ncsu-room-rent-audit.xlsx
      - name: Commit repaired workbook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/ncsu-room-rent-audit.xlsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild room audit as standard XLSX"
          git push
