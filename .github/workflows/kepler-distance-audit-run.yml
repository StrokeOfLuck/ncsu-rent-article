name: Run Kepler distance audit publisher
on:
  push:
    paths: ['.github/workflows/kepler-distance-audit-run.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish files and reference
        run: |
          python - <<'PY'
          import base64, bz2, copy, gzip, json, lzma, re, zlib
          from pathlib import Path

          carrier = Path('.github/workflows/kepler-distance-audit-once.yml').read_text(encoding='utf-8')
          m = re.search(r'PAYLOAD_B64:\s*"([^"]+)"', carrier)
          assert m, 'Could not find embedded Kepler payload'
          raw = base64.b64decode(m.group(1))
          decoded = None
          decoders = [
              lambda b: zlib.decompress(b),
              lambda b: zlib.decompress(b, -15),
              gzip.decompress,
              bz2.decompress,
              lzma.decompress,
          ]
          for decoder in decoders:
              try:
                  candidate = decoder(raw)
                  json.loads(candidate.decode('utf-8'))
                  decoded = candidate
                  break
              except Exception:
                  pass
          assert decoded is not None, 'Embedded payload compression was not recognized'
          files = json.loads(decoded.decode('utf-8'))
          for rel, content in files.items():
              p = Path(rel)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          combined_path = Path('data/kepler/ncsu-rent-main-campus-distance-audit.kepler.gl.json')
          combined = json.loads(combined_path.read_text(encoding='utf-8'))
          def subset(filename, data_ids, title):
              out = copy.deepcopy(combined)
              out['datasets'] = [d for d in out['datasets'] if d['data']['id'] in data_ids]
              inner = out['config']['config']
              inner['visState']['layers'] = [l for l in inner['visState']['layers'] if l['config'].get('dataId') in data_ids]
              inner['visState']['filters'] = []
              if 'interactionConfig' in inner.get('visState', {}):
                  fields = inner['visState']['interactionConfig'].get('tooltip', {}).get('fieldsToShow', {})
                  inner['visState']['interactionConfig']['tooltip']['fieldsToShow'] = {k:v for k,v in fields.items() if k in data_ids}
              out['info'] = dict(out.get('info') or {})
              out['info']['title'] = title
              Path('data/kepler', filename).write_text(json.dumps(out, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          subset('ncsu-rent-main-campus_0-1mi-distance.kepler.gl.json', {'main_0_1','campus_reference'}, 'NC State Main Campus 0–1 mile distance audit')
          subset('ncsu-rent-main-campus_1-3mi-distance.kepler.gl.json', {'main_1_3','campus_reference'}, 'NC State Main Campus >1–3 mile distance audit')

          source = Path('.github/workflows/kepler-distance-audit-trigger.yml').read_text(encoding='utf-8')
          fm = re.search(r"fragment = '''(.*?)'''", source, re.S)
          assert fm, 'Could not recover reference fragment'
          fragment = fm.group(1)
          fragment = fragment.replace('0–1 mile file</div>', '0–1 mile Kepler file</div>').replace('Kepler-ready CSV from the 1-mile workbook Distance Band tab</a>', 'CSV source for the 0–1 mile Kepler audit</a>')
          fragment = fragment.replace('&gt;1–3 mile file</div>', '&gt;1–3 mile Kepler file</div>').replace('Kepler-ready CSV from the 3-mile workbook Distance Band tab</a>', 'CSV source for the &gt;1–3 mile Kepler audit</a>')
          refs = Path('references.html')
          text = refs.read_text(encoding='utf-8')
          if 'id="kepler-distance-audit"' not in text:
              marker = '          <div class="ref-no">Reference 02</div>'
              pos = text.index(marker)
              article = text.rfind('    <article class="ref">', 0, pos)
              refs.write_text(text[:article] + fragment + text[article:], encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html data/kepler
          git commit -m "Add Kepler Main Campus distance audit [skip ci]"
          git push

      - name: Remove temporary workflows
        run: |
          git pull --rebase
          git rm .github/workflows/kepler-distance-audit-run.yml .github/workflows/kepler-distance-audit-trigger.yml .github/workflows/kepler-distance-audit-once.yml .github/kepler-distance-audit.run
          git commit -m "Remove one-time Kepler audit workflows [skip ci]"
          git push
