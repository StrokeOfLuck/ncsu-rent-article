name: Publish Kepler reference

on:
  push:
    paths:
      - '.github/kepler-distance-audit.run'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Kepler reference
        run: python scripts/add_kepler_distance_reference.py
      - name: Commit reference update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Kepler distance audit reference [skip ci]"
            git push
          fi
