name: Clarify overall rent audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-clarify-overall-rent-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify numeric-listing denominator
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit clarification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-clarify-overall-rent-audit.yml
          git add references.html .github/workflows/chatgpt-clarify-overall-rent-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "Clarify overall rent calculation denominator"
          git push
