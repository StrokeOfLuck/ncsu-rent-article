name: Import food and housing report PDF

on:
  push:
    paths:
      - "data/uploads/rebuild-food-housing-pdf.trigger"

permissions:
  contents: write

jobs:
  import-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official March 2024 report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          url="https://dasa.ncsu.edu/wp-content/uploads/sites/76/2024/03/Homelessness-and-Food-and-Housing-Insecurity-Among-NC-State-Students-March-2024.pdf"
          curl -fL --retry 4 --retry-delay 2 "$url" -o assets/2023-food-and-housing-insecurity.pdf
          test "$(head -c 4 assets/2023-food-and-housing-insecurity.pdf)" = "%PDF"
          size="$(wc -c < assets/2023-food-and-housing-insecurity.pdf)"
          test "$size" -gt 500000
      - name: Commit PDF and clean temporary upload files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/uploads/food-housing-pdf
          rm -f data/uploads/rebuild-food-housing-pdf.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/2023-food-and-housing-insecurity.pdf data/uploads
          git commit -m "Add March 2024 food and housing insecurity report PDF"
          git push
