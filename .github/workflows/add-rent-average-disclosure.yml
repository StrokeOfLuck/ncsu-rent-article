name: Add rent average disclosure
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-rent-average-disclosure.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update front-page disclosure
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-rent-average-disclosure.yml
          git add index.html
          git commit -m "Clarify rent average disclosure [skip ci]"
          git push
