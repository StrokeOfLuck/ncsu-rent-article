name: Add non-overlapping distance-band audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-distance-band-audit.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update article, audit workbook, and references
        run: node .github/scripts/distance-band-audit.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html rental-map-audit.html references.html README.md
          git commit -m "Add non-overlapping rent distance bands and audits" || true
          git push
      - name: Remove one-time patch files
        run: |
          git pull --rebase
          rm -f .github/workflows/chatgpt-distance-band-audit.yml .github/scripts/distance-band-audit.js
          git add .github/workflows/chatgpt-distance-band-audit.yml .github/scripts/distance-band-audit.js
          git commit -m "Remove one-time distance band audit patch" || true
          git push
