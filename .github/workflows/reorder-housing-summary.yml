name: Reorder housing comparison sections

on:
  push:
    paths:
      - '.github/workflows/reorder-housing-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder housing comparison and add labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          budget_marker = '<div class="rent-benchmark-label">NC State on-campus housing budget</div>'
          budget_marker_pos = s.index(budget_marker)
          budget_start = s.rfind('        <div class="rent-benchmark-row">', 0, budget_marker_pos)
          housing_start = s.index('        <div class="housing-monthly">', budget_marker_pos)
          foot_start = s.index('          <div class="housing-monthly-foot">', housing_start)
          housing_end = s.index('\n        </div>', foot_start) + len('\n        </div>')
          budget_block = s[budget_start:housing_start].strip('\n')
          housing_block = s[housing_start:housing_end]
          old_title = '<div class="housing-monthly-title">Monthly equivalent using <a href="https://housing.dasa.ncsu.edu/residential-communities/costs/" target="_blank" rel="noopener noreferrer">official housing rates</a></div>'
          new_title = '<div class="housing-monthly-title">Residence hall monthly equivalent</div>'
          housing_block = housing_block.replace(old_title, new_title, 1)
          old_note = '<div class="housing-monthly-note">Projected 2026–27 residence hall rates converted from semester charges to 9-month academic-year monthly equivalents.</div>'
          new_note = '<div class="housing-monthly-note">Projected 2026–27 residence hall rates from <a href="https://housing.dasa.ncsu.edu/residential-communities/costs/" target="_blank" rel="noopener noreferrer">official housing rates</a>, converted from semester charges to 9-month academic-year monthly equivalents.</div>'
          housing_block = housing_block.replace(old_note, new_note, 1)
          budget_header = '        <div class="housing-monthly housing-budget-section">\n          <div class="housing-monthly-title">Official NC State housing budgets</div>\n          <div class="housing-monthly-note">2026–27 cost-of-attendance housing estimates for full-time fall + spring enrollment.</div>\n\n'
          budget_wrapped = budget_header + budget_block + '\n        </div>'
          s = s[:budget_start] + housing_block + '\n\n' + budget_wrapped + s[housing_end:]
          s = s.replace('.housing-monthly-title a{', '.housing-monthly-title a,\n.housing-monthly-note a{', 1)
          s = s.replace('.housing-monthly-title a:hover{', '.housing-monthly-title a:hover,\n.housing-monthly-note a:hover{', 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/reorder-housing-summary.yml').unlink(missing_ok=True)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/reorder-housing-summary.yml
          git commit -m 'Move housing budgets below residence hall comparison [skip ci]' || exit 0
          git push
