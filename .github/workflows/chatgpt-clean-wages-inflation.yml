name: Clean wages and inflation footer

on:
  push:
    paths:
      - '.github/workflows/chatgpt-clean-wages-inflation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch footer
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        run: |
          git add index.html
          git commit -m "Clean up wages and inflation footer [skip ci]"
          git push
      - name: Remove one-time workflow
        run: |
          git pull --rebase
          git rm .github/workflows/chatgpt-clean-wages-inflation.yml
          git commit -m "Remove one-time footer workflow [skip ci]"
          git push
