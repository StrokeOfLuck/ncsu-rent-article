name: Polish housing summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-polish-housing-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align headers, clarify shared room, and polish context footer
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-polish-housing-summary.yml
          git add index.html .github/workflows/chatgpt-polish-housing-summary.yml
          git diff --cached --quiet && exit 0
          git commit -m "Polish housing summary labels and context"
          git push
