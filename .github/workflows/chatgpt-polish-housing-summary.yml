name: Polish housing summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-polish-housing-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align headers, clarify shared room, and polish context footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('padding:8px 10px 7px;', 'padding:8px 0 7px;', 1)
          s = s.replace('padding:7px 8px;', 'padding:7px 0;', 1)
          s = s.replace(
              '<div class="rent-benchmark-label">Residence hall double</div>',
              '<div class="rent-benchmark-label">Residence hall double (shared room)</div>',
              1,
          )
          s = s.replace(
              '<div class="housing-rate-context-title">Wages and inflation</div>',
              '<div class="housing-rate-context-title"><span>Wages</span><span>&amp;</span><span>Inflation</span></div>',
              1,
          )

          icon_pattern = re.compile(
              r'(<div class="housing-rate-context-icon" aria-hidden="true">\s*)<svg viewBox="0 0 40 40">.*?</svg>',
              re.S,
          )
          new_icon = '''<svg viewBox="0 0 40 40">
            <g fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="15" cy="15" r="8"></circle>
              <circle cx="24" cy="24" r="8"></circle>
            </g>
            <text x="15" y="18.4" text-anchor="middle" fill="currentColor" font-size="9" font-weight="800">$</text>
            <text x="24" y="27.4" text-anchor="middle" fill="currentColor" font-size="9" font-weight="800">$</text>
          </svg>'''
          s, count = icon_pattern.subn(lambda m: m.group(1) + new_icon, s, count=1)
          if count != 1:
              raise SystemExit('Wage icon not found')

          override = '''

          /* Final housing summary alignment + context title */
          .housing-section-head{
            padding-left:0;
            padding-right:0;
          }
          .housing-rate-context-title{
            min-height:68px;
            flex-direction:column;
            justify-content:space-between;
            align-items:flex-start;
            padding:3px 18px 3px 0;
          }
          @media(max-width:700px){
            .housing-rate-context-title{
              min-height:0;
              flex-direction:row;
              justify-content:flex-start;
              gap:5px;
              padding:0 0 8px;
            }
          }
          '''
          marker = '</style>'
          pos = s.find(marker)
          if pos == -1:
              raise SystemExit('Style closing tag not found')
          s = s[:pos] + override + s[pos:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-polish-housing-summary.yml
          git add index.html .github/workflows/chatgpt-polish-housing-summary.yml
          git diff --cached --quiet && exit 0
          git commit -m "Polish housing summary labels and context"
          git push
