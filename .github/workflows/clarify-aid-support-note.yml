name: Clarify aid support note
on:
  push:
    paths:
      - .github/clarify-aid-support-note.py
      - .github/workflows/clarify-aid-support-note.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify aid support note
        run: python .github/clarify-aid-support-note.py
      - name: Commit copy update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Clarify how aid changes available monthly resources"
            git push
          fi
