name: Tighten mobile rent layout
on:
  push:
    paths:
      - .github/workflows/tighten-mobile-layout.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten mobile layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = r'''

/* Tighten mobile wage note and affordability legend */
.rent-trend-wage-note {
  white-space: nowrap;
}

@media (max-width: 720px) {
  .rent-trend-wage-note {
    font-size: clamp(6.5px, 1.85vw, 8px);
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .burden-legend {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 4px 7px;
    padding: 7px 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .burden-legend .legend-column {
    min-width: 0;
    gap: 3px;
  }

  .burden-legend .legend-piece {
    grid-template-columns: 10px auto minmax(0, 1fr);
    column-gap: 3px;
    font-size: 7.6px;
    line-height: 1.15;
  }

  .burden-legend .legend-action {
    grid-column: auto;
    grid-row: 1;
    justify-self: end;
    align-self: center;
    margin: 0;
  }

  .burden-legend .hud-info-btn {
    padding: 5px 6px;
    font-size: 7.4px;
    white-space: nowrap;
  }
}
'''
          tag = '/* Tighten mobile wage note and affordability legend */'
          if tag not in s:
              s = s.replace(marker, css + '\n' + marker, 1)
          s = s.replace('MONTHLY INCOME AT', 'MONTHLY INCOME')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tighten-mobile-layout.yml
          git add index.html .github/workflows/tighten-mobile-layout.yml
          git commit -m "Tighten mobile wage note and legend spacing"
          git push
