name: Apply housing reference redesign
on:
  push:
    paths:
      - .github/workflows/apply-housing-reference-redesign.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch references page
        run: python .github/scripts/patch-housing-reference.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-housing-reference-redesign.yml
          rm .github/scripts/patch-housing-reference.py
          git add references.html .github/workflows/apply-housing-reference-redesign.yml .github/scripts/patch-housing-reference.py
          git commit -m "Redesign housing range math and add projected rate chart [skip ci]"
          git push
