name: Update residence hall math
on:
  push:
    paths:
      - .github/workflows/update-residence-hall-math.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update references math
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('references.html'); s=p.read_text(encoding='utf-8'); start_marker='    <h2>Step-by-step monthly equivalent math</h2>'; saved_marker='    <h2>Saved evidence</h2>'; start=s.find(start_marker); saved=s.find(saved_marker,start); rule_start=s.rfind('    <hr class=\"rule\">',start,saved); assert start!=-1 and saved!=-1 and rule_start!=-1; new=base64.b64decode(''); s=s[:start]+new.decode('utf-8')+s[rule_start:]; p.write_text(s,encoding='utf-8')"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-residence-hall-math.yml
          git add references.html .github/workflows/update-residence-hall-math.yml
          git commit -m "Show double and single low midpoint high housing math [skip ci]"
          git push
