name: Clarify housing comparison sections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-clarify-housing-sections.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve housing comparison section hierarchy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '''.housing-monthly-title{\n  font-size:10px;\n  font-weight:820;\n  line-height:1.25;\n}\n'''
          css_replacement = css_anchor + '''\n.housing-section-head{\n  display:flex;\n  justify-content:space-between;\n  align-items:flex-end;\n  gap:8px 14px;\n  flex-wrap:wrap;\n  margin-bottom:7px;\n  padding:8px 10px 7px;\n  background:var(--soft);\n  border-left:3px solid var(--campus);\n}\n\n.housing-section-first{\n  margin-bottom:8px;\n}\n\n.housing-section-kicker{\n  margin-bottom:3px;\n  color:var(--muted);\n  font-size:7.8px;\n  line-height:1;\n  text-transform:uppercase;\n  letter-spacing:.11em;\n  font-weight:850;\n}\n\n.housing-section-title{\n  color:var(--ink);\n  font-size:11.5px;\n  line-height:1.2;\n  font-weight:850;\n}\n\n.housing-section-head .combined-source{\n  margin-left:auto;\n  font-size:8.5px;\n  line-height:1.2;\n  font-weight:500;\n}\n'''
          if css_anchor not in text:
              raise SystemExit('Housing title CSS anchor not found')
          text = text.replace(css_anchor, css_replacement, 1)

          mobile_anchor = '''  .combined-source{\n    margin-left:0;\n  }\n'''
          mobile_replacement = mobile_anchor + '''  .housing-section-head{\n    align-items:flex-start;\n    padding:7px 8px;\n  }\n  .housing-section-title{\n    font-size:10.5px;\n  }\n  .housing-section-head .combined-source{\n    margin-left:0;\n  }\n'''
          if mobile_anchor not in text:
              raise SystemExit('Mobile combined-source anchor not found')
          text = text.replace(mobile_anchor, mobile_replacement, 1)

          top_anchor = '''      <div class="combined-card">\n        <div class="combined-top-note">\n          <span id="combinedRentMeta">Main, Centennial and Biomedical Campus · overall average of all displayed 1-, 3- and 5-mile summary ranges</span>\n        </div>\n'''
          top_replacement = '''      <div class="combined-card">\n        <div class="housing-section-head housing-section-first">\n          <div>\n            <div class="housing-section-kicker">Off campus listings</div>\n            <div class="housing-section-title">Advertised rents from NC State’s Off-Campus Housing site</div>\n          </div>\n        </div>\n        <div class="combined-top-note">\n          <span id="combinedRentMeta">Main, Centennial and Biomedical Campus · overall average of all displayed 1-, 3- and 5-mile summary ranges</span>\n        </div>\n'''
          if top_anchor not in text:
              raise SystemExit('Top combined-card anchor not found')
          text = text.replace(top_anchor, top_replacement, 1)

          residence_anchor = '''        <div class="housing-monthly">\n          <div class="housing-monthly-title">Residence hall monthly equivalent</div>\n          <div class="housing-monthly-note">Projected 2026–27 residence hall rates from <a href="https://housing.dasa.ncsu.edu/residential-communities/costs/" target="_blank" rel="noopener noreferrer">official housing rates</a>, converted from semester charges to 9-month academic-year monthly equivalents.</div>\n'''
          residence_replacement = '''        <div class="housing-monthly">\n          <div class="housing-section-head">\n            <div>\n              <div class="housing-section-kicker">On campus room rates</div>\n              <div class="housing-section-title">Residence hall monthly equivalent</div>\n            </div>\n          </div>\n          <div class="housing-monthly-note">Projected 2026–27 residence hall rates from <a href="https://housing.dasa.ncsu.edu/residential-communities/costs/" target="_blank" rel="noopener noreferrer">official housing rates</a>, converted from semester charges to 9-month academic-year monthly equivalents.</div>\n'''
          if residence_anchor not in text:
              raise SystemExit('Residence hall heading anchor not found')
          text = text.replace(residence_anchor, residence_replacement, 1)

          budget_anchor = '''        <div class="housing-monthly housing-budget-section">\n          <div class="housing-monthly-title" style="display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;">\n  <span>Official NC State housing budgets</span>\n  <span class="combined-source" style="font-weight:400;">Source: <a href="https://studentservices.ncsu.edu/finances/estimated-cost-of-attendance/undergraduate-student-estimated-cost-of-attendance/" target="_blank" rel="noopener noreferrer">NC State Cost of Attendance</a></span>\n</div>\n          <div class="housing-monthly-note">2026–27 cost-of-attendance housing estimates for full-time fall + spring enrollment.</div>\n'''
          budget_replacement = '''        <div class="housing-monthly housing-budget-section">\n          <div class="housing-section-head">\n            <div>\n              <div class="housing-section-kicker">NC State budget estimates</div>\n              <div class="housing-section-title">Official NC State housing budgets</div>\n            </div>\n            <span class="combined-source">Source: <a href="https://studentservices.ncsu.edu/finances/estimated-cost-of-attendance/undergraduate-student-estimated-cost-of-attendance/" target="_blank" rel="noopener noreferrer">NC State Cost of Attendance</a></span>\n          </div>\n          <div class="housing-monthly-note">2026–27 cost-of-attendance housing estimates for full-time fall + spring enrollment.</div>\n'''
          if budget_anchor not in text:
              raise SystemExit('Budget heading anchor not found')
          text = text.replace(budget_anchor, budget_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/chatgpt-clarify-housing-sections.yml
          git commit -m "Clarify housing comparison sections"
          git push
