name: Redesign housing rate reference
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update housing range math and rate increase chart
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/redesign-housing-rate-reference.yml
          git add references.html .github/workflows/redesign-housing-rate-reference.yml
          git commit -m "Redesign housing range math and add projected rate chart [skip ci]"
          git push
