name: Convert housing rate chart to dot plot
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert housing rate increase bars to dot plots
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_between(text, start, end, replacement):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'missing start marker: {start[:80]}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'missing end marker: {end[:80]}')
              return text[:a] + replacement + text[b:]

          def upsert_css(text, css, begin_marker, end_marker):
              if begin_marker in text:
                  a = text.index(begin_marker)
                  b = text.index(end_marker, a) + len(end_marker)
                  return text[:a] + css + text[b:]
              return text.replace('</style>', css + '\n\n</style>', 1)

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          index_chart_start = '      <div class="housing-rate-chart" aria-label="Projected percentage increase in NC State housing rates from 2025–26 to 2026–27">'
          index_chart_end = '\n\n      <div class="housing-rate-context">'
          index_chart = '''      <div class="housing-rate-chart" aria-label="Projected percentage increase in NC State housing rates from 2025–26 to 2026–27. Dots show each housing rate increase on a zero to eight percent scale. A vertical reference line marks U.S. CPI inflation at 3.4 percent.">
        <div class="housing-rate-axis" aria-hidden="true">
          <div></div>
          <div class="housing-rate-axis-plot">
            <span class="housing-rate-cpi-label">CPI 3.4%</span>
            <span class="housing-rate-axis-tick first" style="left:0%">0%</span>
            <span class="housing-rate-axis-tick" style="left:25%">2%</span>
            <span class="housing-rate-axis-tick" style="left:50%">4%</span>
            <span class="housing-rate-axis-tick" style="left:75%">6%</span>
            <span class="housing-rate-axis-tick last" style="left:100%">8%</span>
          </div>
          <div></div>
        </div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Single</strong>$4,275 → $4,600</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:95%"></span></div><div class="housing-rate-value">7.60%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Wolf Village/Wolf Ridge — 1 bedroom/studio</strong>$5,000 → $5,375</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:93.75%"></span></div><div class="housing-rate-value">7.50%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>E.S. King/Western Manor — studio</strong>$3,900 → $4,150</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:80.125%"></span></div><div class="housing-rate-value">6.41%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Wolf Village/Wolf Ridge — 2, 3 or 4 bedrooms</strong>$4,500 → $4,780</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:77.75%"></span></div><div class="housing-rate-value">6.22%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>E.S. King/Western Manor — 2 bedroom</strong>$5,000 → $5,300</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:75%"></span></div><div class="housing-rate-value">6.00%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>E.S. King — 1-bedroom undergraduate double</strong>$4,125 → $4,350</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:68.125%"></span></div><div class="housing-rate-value">5.45%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>E.S. King/Western Manor — 1 bedroom</strong>$4,375 → $4,600</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:64.25%"></span></div><div class="housing-rate-value">5.14%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Double</strong>$3,800 → $3,970</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:55.875%"></span></div><div class="housing-rate-value">4.47%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Coastal Quarters — single</strong>$4,225 → $4,350</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:37%"></span></div><div class="housing-rate-value">2.96%</div></div>
        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Coastal Quarters — double</strong>$3,950 → $4,025</div><div class="housing-rate-plot"><span class="housing-rate-dot" style="left:23.75%"></span></div><div class="housing-rate-value">1.90%</div></div>
      </div>'''
          s = replace_between(s, index_chart_start, index_chart_end, index_chart)

          index_css = '''/* Housing rate dot plot */
          .housing-rate-chart{
            display:grid;
            gap:8px;
            padding-top:10px;
            border-top:1px solid var(--line);
          }
          .housing-rate-axis,
          .housing-rate-row{
            display:grid;
            grid-template-columns:minmax(250px,1.45fr) minmax(180px,1fr) 56px;
            gap:10px;
            align-items:center;
          }
          .housing-rate-axis{
            margin-bottom:8px;
          }
          .housing-rate-axis-plot{
            position:relative;
            height:32px;
            border-bottom:1px solid var(--line);
          }
          .housing-rate-axis-tick{
            position:absolute;
            bottom:-15px;
            transform:translateX(-50%);
            color:var(--muted);
            font-size:8.5px;
            font-weight:700;
            font-variant-numeric:tabular-nums;
            white-space:nowrap;
          }
          .housing-rate-axis-tick.first{ transform:none; }
          .housing-rate-axis-tick.last{ transform:translateX(-100%); }
          .housing-rate-cpi-label{
            position:absolute;
            left:42.5%;
            top:0;
            transform:translateX(-50%);
            color:var(--blue);
            font-size:8.5px;
            font-weight:800;
            white-space:nowrap;
          }
          .housing-rate-cpi-label::after{
            content:"";
            position:absolute;
            left:50%;
            top:13px;
            height:19px;
            border-left:1px dashed var(--blue);
            opacity:.7;
          }
          .housing-rate-plot{
            position:relative;
            height:18px;
          }
          .housing-rate-plot::before{
            content:"";
            position:absolute;
            left:0;
            right:0;
            top:50%;
            border-top:1px solid var(--line);
          }
          .housing-rate-plot::after{
            content:"";
            position:absolute;
            left:42.5%;
            top:-5px;
            bottom:-5px;
            border-left:1px dashed var(--blue);
            opacity:.55;
          }
          .housing-rate-dot{
            position:absolute;
            top:50%;
            width:10px;
            height:10px;
            border-radius:50%;
            transform:translate(-50%,-50%);
            background:var(--accent);
            box-shadow:0 0 0 2px var(--paper), 0 0 0 3px var(--accent);
            z-index:2;
          }
          @media(max-width:700px){
            .housing-rate-axis,
            .housing-rate-row{
              grid-template-columns:minmax(0,1fr) 48px;
              gap:4px 8px;
            }
            .housing-rate-axis > div:first-child,
            .housing-rate-axis > div:last-child{
              display:none;
            }
            .housing-rate-axis-plot{
              grid-column:1 / -1;
              height:32px;
            }
            .housing-rate-plot{
              grid-column:1 / -1;
              grid-row:2;
            }
            .housing-rate-value{
              grid-column:2;
              grid-row:1;
            }
          }
          /* End housing rate dot plot */'''
          s = upsert_css(s, index_css, '/* Housing rate dot plot */', '/* End housing rate dot plot */')
          index.write_text(s, encoding='utf-8')

          refs = Path('references.html')
          r = refs.read_text(encoding='utf-8')
          refs_chart_start = '    <div class="rate-change-chart" aria-label="Projected percentage increase in NC State housing rates from 2025–26 to 2026–27">'
          refs_chart_end = '\n\n    <div class="use-note">\n      The largest projected increase'
          refs_chart = '''    <div class="rate-change-chart" aria-label="Projected percentage increase in NC State housing rates from 2025–26 to 2026–27. Dots show each rate increase on a zero to eight percent scale. A vertical reference line marks U.S. CPI inflation at 3.4 percent.">
      <div class="rate-change-axis" aria-hidden="true"><div></div><div class="rate-change-axis-plot"><span class="rate-change-cpi-label">CPI 3.4%</span><span class="rate-change-axis-tick first" style="left:0%">0%</span><span class="rate-change-axis-tick" style="left:25%">2%</span><span class="rate-change-axis-tick" style="left:50%">4%</span><span class="rate-change-axis-tick" style="left:75%">6%</span><span class="rate-change-axis-tick last" style="left:100%">8%</span></div><div></div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Single</strong>$4,275 → $4,600</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:95%"></span></div><div class="rate-change-value">7.60%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Wolf Village/Wolf Ridge — 1 bedroom/studio</strong>$5,000 → $5,375</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:93.75%"></span></div><div class="rate-change-value">7.50%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>E.S. King/Western Manor — studio</strong>$3,900 → $4,150</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:80.125%"></span></div><div class="rate-change-value">6.41%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Wolf Village/Wolf Ridge — 2, 3 or 4 bedrooms</strong>$4,500 → $4,780</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:77.75%"></span></div><div class="rate-change-value">6.22%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>E.S. King/Western Manor — 2 bedroom</strong>$5,000 → $5,300</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:75%"></span></div><div class="rate-change-value">6.00%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>E.S. King — 1-bedroom undergraduate double</strong>$4,125 → $4,350</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:68.125%"></span></div><div class="rate-change-value">5.45%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>E.S. King/Western Manor — 1 bedroom</strong>$4,375 → $4,600</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:64.25%"></span></div><div class="rate-change-value">5.14%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Double</strong>$3,800 → $3,970</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:55.875%"></span></div><div class="rate-change-value">4.47%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Coastal Quarters — single</strong>$4,225 → $4,350</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:37%"></span></div><div class="rate-change-value">2.96%</div></div>
      <div class="rate-change-row"><div class="rate-change-label"><strong>Coastal Quarters — double</strong>$3,950 → $4,025</div><div class="rate-change-plot"><span class="rate-change-dot" style="left:23.75%"></span></div><div class="rate-change-value">1.90%</div></div>
    </div>'''
          r = replace_between(r, refs_chart_start, refs_chart_end, refs_chart)

          refs_css = '''/* Reference rate-change dot plot */
          .rate-change-axis,
          .rate-change-row{
            display:grid;
            grid-template-columns:minmax(245px,1.45fr) minmax(180px,1fr) 58px;
            gap:10px;
            align-items:center;
          }
          .rate-change-axis{ margin-bottom:8px; }
          .rate-change-axis-plot{
            position:relative;
            height:32px;
            border-bottom:1px solid var(--line);
          }
          .rate-change-axis-tick{
            position:absolute;
            bottom:-15px;
            transform:translateX(-50%);
            color:var(--muted);
            font-size:8.5px;
            font-weight:700;
            font-variant-numeric:tabular-nums;
            white-space:nowrap;
          }
          .rate-change-axis-tick.first{ transform:none; }
          .rate-change-axis-tick.last{ transform:translateX(-100%); }
          .rate-change-cpi-label{
            position:absolute;
            left:42.5%;
            top:0;
            transform:translateX(-50%);
            color:var(--link);
            font-size:8.5px;
            font-weight:800;
            white-space:nowrap;
          }
          .rate-change-cpi-label::after{
            content:"";
            position:absolute;
            left:50%;
            top:13px;
            height:19px;
            border-left:1px dashed var(--link);
            opacity:.7;
          }
          .rate-change-plot{
            position:relative;
            height:18px;
          }
          .rate-change-plot::before{
            content:"";
            position:absolute;
            left:0;
            right:0;
            top:50%;
            border-top:1px solid var(--line);
          }
          .rate-change-plot::after{
            content:"";
            position:absolute;
            left:42.5%;
            top:-5px;
            bottom:-5px;
            border-left:1px dashed var(--link);
            opacity:.55;
          }
          .rate-change-dot{
            position:absolute;
            top:50%;
            width:10px;
            height:10px;
            border-radius:50%;
            transform:translate(-50%,-50%);
            background:var(--accent);
            box-shadow:0 0 0 2px var(--soft2), 0 0 0 3px var(--accent);
            z-index:2;
          }
          @media(max-width:700px){
            .rate-change-axis,
            .rate-change-row{
              grid-template-columns:1fr 46px;
              gap:5px 8px;
            }
            .rate-change-axis > div:first-child,
            .rate-change-axis > div:last-child{ display:none; }
            .rate-change-axis-plot{
              grid-column:1 / -1;
              height:32px;
            }
            .rate-change-plot{
              grid-column:1 / -1;
              grid-row:2;
            }
            .rate-change-value{
              grid-column:2;
              grid-row:1;
            }
          }
          /* End reference rate-change dot plot */'''
          r = upsert_css(r, refs_css, '/* Reference rate-change dot plot */', '/* End reference rate-change dot plot */')
          refs.write_text(r, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html references.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Convert housing rate chart to dot plot"
            git push
          fi