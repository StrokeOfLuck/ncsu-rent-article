name: Convert housing rate chart to dot plot
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert housing rate increase bars to dot plot
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(' cGVyKSwgMCAwIDAgM3B4IHZhcigtLWFjY2VudCk7CiAgei1pbmRleDoyOwp9CkBtZWRpYShtYXgtd2lkdGg6NzAwcHgp '))"
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Convert housing rate chart to dot plot"
            git push
          fi