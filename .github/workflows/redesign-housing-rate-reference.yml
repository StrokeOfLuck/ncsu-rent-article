name: Make CPI benchmark continuous
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make CPI reference line continuous
        run: python .github/dotplot_patch.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Make CPI benchmark line continuous"
            git push
          fi
