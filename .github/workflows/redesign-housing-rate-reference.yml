name: Add BLS housing benchmarks
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rent, school lodging and CPI benchmarks
        run: python .github/dotplot_patch.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html references.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add BLS housing price benchmarks"
            git push
          fi
