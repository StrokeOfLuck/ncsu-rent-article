name: Solid mobile housing benchmark line
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
      - .github/align-benchmark-label.py
      - .github/add-housing-dollar-increase.py
      - .github/embed-original-housing-rate.py
      - .github/add-resnet-toggle.py
      - .github/bust-reference-math-cache.py
      - .github/fix-story-width-copy.py
      - .github/remove-work-wages-heading.py
      - .github/tighten-embedded-campus-controls.py
      - .github/update-bls-august-reference.py
      - .github/update-wage-barrie-copy.py
      - .github/add-resource-comparison-section.py
      - .github/sync-hours-and-resource-layout.py
      - .github/clarify-resnet-labels.py
      - .github/fix-rent-options-and-embed-gap.py
      - .github/fix-350-axis.py
      - .github/fix-lede-and-aid-title.py
      - .github/attach-campus-controls-to-rate-cards.py
      - .github/fix-resnet-note.py
      - .github/restore-required-resnet.py
      - .github/fix-visible-rent-midpoint.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply housing rate chart refinements
        run: |
          python .github/align-benchmark-label.py
          python .github/add-housing-dollar-increase.py
          python .github/embed-original-housing-rate.py
          python .github/add-resnet-toggle.py
          python .github/bust-reference-math-cache.py
          python .github/fix-story-width-copy.py
          python .github/remove-work-wages-heading.py
          python .github/tighten-embedded-campus-controls.py
          python .github/update-bls-august-reference.py
          python .github/update-wage-barrie-copy.py
          python .github/add-resource-comparison-section.py
          python .github/sync-hours-and-resource-layout.py
          python .github/clarify-resnet-labels.py
          python .github/fix-rent-options-and-embed-gap.py
          python .github/fix-350-axis.py
          python .github/fix-lede-and-aid-title.py
          python .github/attach-campus-controls-to-rate-cards.py
          python .github/fix-resnet-note.py
          python .github/restore-required-resnet.py
          python .github/fix-visible-rent-midpoint.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add index.html draft-story-0915.html references.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Align story copy with graphics"
            git push
          fi
