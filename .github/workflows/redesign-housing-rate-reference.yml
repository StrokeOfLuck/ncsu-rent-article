name: Fix housing chart mobile layout
on:
  push:
    paths:
      - .github/workflows/redesign-housing-rate-reference.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile housing chart cleanup
        run: python .github/align-benchmark-label.py
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix housing rate chart on mobile"
            git push
          fi
