name: Add article references link
on:
  push:
    paths:
      - .github/workflows/make-article-link-obvious.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add references link below article title
        shell: bash
        run: |
          set -e
          git pull --rebase origin main
          python <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'class="title-reference-link"' not in s:
              css = '''

.title-reference-link {
  display:inline-block;
  margin-top:2px;
  color:var(--blue);
  font-size:10.5px;
  line-height:1.3;
  font-weight:750;
  text-decoration:underline;
  text-underline-offset:2px;
}
.title-reference-link:hover {
  color:#1e4f80;
}
'''
              if '</style>' not in s:
                  raise SystemExit('Could not find </style>')
              s = s.replace('</style>', css + '\n</style>', 1)

              old = '      <h1>Can NC State Students Afford to Live Near Campus?</h1>'
              new = '      <h1>Can NC State Students Afford to Live Near Campus?</h1>\n      <a class="title-reference-link" href="references.html" target="_blank" rel="noopener noreferrer">References &amp; methodology ↗</a>'
              if old not in s:
                  raise SystemExit('Could not find article title markup')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/make-article-link-obvious.yml
          rm -f .github/workflows/add-title-references-link.yml
          git add index.html .github/workflows/make-article-link-obvious.yml .github/workflows/add-title-references-link.yml
          git commit -m "Add references link below title [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
