name: Add wages and inflation footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-add-wages-inflation-footer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add wages and inflation footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css_marker = '/* Wages and inflation context footer */'
          if css_marker not in s:
              css = r'''

/* Wages and inflation context footer */
.housing-rate-context{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid var(--line);
}
.housing-rate-context-title{
  margin-bottom:6px;
  color:var(--muted);
  font-size:8.5px;
  line-height:1;
  font-weight:850;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.housing-rate-context-row{
  display:flex;
  flex-wrap:wrap;
  align-items:baseline;
  gap:5px 18px;
  color:#4e4a45;
  font-size:9px;
  line-height:1.45;
}
.housing-rate-context-item strong{
  color:var(--ink);
  font-weight:800;
}
.housing-rate-context-sources{
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
  line-height:1.35;
}
.housing-rate-context-sources a{
  color:var(--blue);
  font-weight:700;
  text-decoration:none;
}
.housing-rate-context-sources a:hover{
  text-decoration:underline;
}
@media(max-width:700px){
  .housing-rate-context-row{
    display:grid;
    gap:3px;
  }
}
'''
              s = s.replace('</style>', css + '\n</style>', 1)

          footer = r'''

      <div class="housing-rate-context">
        <div class="housing-rate-context-title">Wages and inflation</div>
        <div class="housing-rate-context-row">
          <span class="housing-rate-context-item"><strong>Federal minimum wage</strong> $7.25/hour, unchanged since July 2009</span>
          <span class="housing-rate-context-item"><strong>12-month CPI</strong> +3.4%, July 2025 to July 2026</span>
        </div>
        <div class="housing-rate-context-sources">Sources: <a href="https://www.dol.gov/agencies/whd/minimum-wage/history/chart" target="_blank" rel="noopener noreferrer">U.S. Department of Labor</a> · <a href="https://www.bls.gov/news.release/cpi.htm" target="_blank" rel="noopener noreferrer">U.S. Bureau of Labor Statistics</a></div>
      </div>
'''

          if 'housing-rate-context-title">Wages and inflation' not in s:
              needle = '''        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Coastal Quarters — double</strong>$3,950 → $4,025</div><div class="housing-rate-track"><div class="housing-rate-bar" style="width:23.75%"></div></div><div class="housing-rate-value">1.90%</div></div>\n      </div>\n\n      \n    </div>'''
              replacement = '''        <div class="housing-rate-row"><div class="housing-rate-label"><strong>Coastal Quarters — double</strong>$3,950 → $4,025</div><div class="housing-rate-track"><div class="housing-rate-bar" style="width:23.75%"></div></div><div class="housing-rate-value">1.90%</div></div>\n      </div>''' + footer + '''\n    </div>'''
              if needle not in s:
                  raise SystemExit('Expected housing chart closing block not found')
              s = s.replace(needle, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-add-wages-inflation-footer.yml
          git add index.html .github/workflows/chatgpt-add-wages-inflation-footer.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add wages and inflation context to housing rate chart"
          git push
