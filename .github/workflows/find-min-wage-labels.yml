name: Locate wage labels
on:
  push:
    paths:
      - .github/workflows/find-min-wage-labels.yml
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find rent trend source snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          patterns = [r'rent-trend', r'federal', r'fifteen', r'housing', r'legend']
          out = []
          for pat in patterns:
              out.append(f'===== {pat} =====')
              matches = list(re.finditer(pat, s, re.I))
              out.append(f'COUNT {len(matches)}')
              for i, m in enumerate(matches):
                  a = max(0, m.start()-650)
                  b = min(len(s), m.end()+900)
                  snippet = s[a:b].replace('\n','\\n')
                  out.append(f'MATCH {i+1} @ {m.start()}: {snippet}')
          Path('.github/rent-trend-debug.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit debug snippets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rent-trend-debug.txt
          git commit -m "Capture rent trend source snippets [skip ci]"
          git push
