name: Locate wage labels
on:
  push:
    paths:
      - .github/workflows/find-min-wage-labels.yml
permissions:
  contents: write
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture matching source lines
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lines = Path('index.html').read_text(encoding='utf-8').splitlines()
          needles = ('rent-trend', 'federal', 'fifteen', 'housing wage', 'hmfa', 'threshold')
          out = []
          for n, line in enumerate(lines, 1):
              low = line.lower()
              if any(x in low for x in needles):
                  out.append(f'{n}: {line}')
          Path('.github/rent-trend-debug.txt').write_text('\n'.join(out), encoding='utf-8')
          PY
      - name: Commit debug lines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rent-trend-debug.txt
          git commit -m "Capture matching wage source lines [skip ci]"
          git push
