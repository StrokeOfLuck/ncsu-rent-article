name: Merge radius layers into Kepler audits

on:
  push:
    paths:
      - '.github/workflows/merge-radius-layers-kepler.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add radius layers and repair Kepler source files
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import csv
          import io
          import json
          from pathlib import Path

          base = Path('data/kepler')
          p01 = base / 'ncsu-rent-main-campus_0-1mi-distance.kepler.gl.json'
          p13 = base / 'ncsu-rent-main-campus_1-3mi-distance.kepler.gl.json'
          pc = base / 'ncsu-rent-main-campus_radius-circles.kepler.gl.json'

          m01 = json.loads(p01.read_text(encoding='utf-8'))
          m13 = json.loads(p13.read_text(encoding='utf-8'))
          circles = json.loads(pc.read_text(encoding='utf-8'))

          circle_ds = {d['data']['id']: d for d in circles['datasets']}
          circle_layers = {
              l['config'].get('dataId'): l
              for l in circles['config']['config']['visState']['layers']
              if l['config'].get('dataId') in {'radius_1', 'radius_3'}
          }

          def add_circles(doc, title):
              # Keep listing/campus datasets intact, but make the two boundary
              # geometries independent datasets and layers inside the same map.
              doc['datasets'] = [
                  d for d in doc['datasets']
                  if d['data']['id'] not in {'radius_1', 'radius_3'}
              ]
              doc['datasets'].extend([
                  copy.deepcopy(circle_ds['radius_3']),
                  copy.deepcopy(circle_ds['radius_1'])
              ])

              vis = doc['config']['config']['visState']
              vis['layers'] = [
                  l for l in vis['layers']
                  if l['config'].get('dataId') not in {'radius_1', 'radius_3'}
              ]
              # Put circle boundaries first in the layer list and leave them visible.
              # They remain independently toggleable in Kepler's layer panel.
              r3 = copy.deepcopy(circle_layers['radius_3'])
              r1 = copy.deepcopy(circle_layers['radius_1'])
              r3['config']['isVisible'] = True
              r1['config']['isVisible'] = True
              r3['config']['visConfig']['thickness'] = 5
              r1['config']['visConfig']['thickness'] = 5
              vis['layers'] = [r3, r1] + vis['layers']

              tooltip = vis.setdefault('interactionConfig', {}).setdefault('tooltip', {})
              fields = tooltip.setdefault('fieldsToShow', {})
              fields['radius_1'] = [
                  {'name':'label','format':None},
                  {'name':'radius_miles','format':None},
                  {'name':'distance_definition','format':None}
              ]
              fields['radius_3'] = [
                  {'name':'label','format':None},
                  {'name':'radius_miles','format':None},
                  {'name':'distance_definition','format':None}
              ]

              # Frame the map so the 3-mile circle can actually be seen.
              state = doc['config']['config']['mapState']
              state['latitude'] = 35.77951
              state['longitude'] = -78.68168
              state['zoom'] = 11.55
              state['bearing'] = 0
              state['pitch'] = 0

              doc.setdefault('info', {})['title'] = title
              doc['info']['description'] = (
                  'Distance audit with listing points plus independently toggleable '
                  '1-mile and 3-mile straight-line radius boundaries centered on the '
                  'Main Campus reference point.'
              )
              return doc

          m01 = add_circles(m01, 'NC State Main Campus 0–1 mile distance audit + radius boundaries')
          m13 = add_circles(m13, 'NC State Main Campus >1–3 mile distance audit + radius boundaries')

          p01.write_text(json.dumps(m01, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          p13.write_text(json.dumps(m13, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')

          # Build one complete preloaded audit map containing both listing bands,
          # both radius boundaries, and the campus reference point.
          full = copy.deepcopy(m01)
          have_ds = {d['data']['id'] for d in full['datasets']}
          for d in m13['datasets']:
              if d['data']['id'] not in have_ds:
                  full['datasets'].append(copy.deepcopy(d))
                  have_ds.add(d['data']['id'])

          vis_full = full['config']['config']['visState']
          have_layers = {l['id'] for l in vis_full['layers']}
          for l in m13['config']['config']['visState']['layers']:
              if l['id'] not in have_layers:
                  vis_full['layers'].append(copy.deepcopy(l))
                  have_layers.add(l['id'])

          fields = vis_full.setdefault('interactionConfig', {}).setdefault('tooltip', {}).setdefault('fieldsToShow', {})
          fields.update(copy.deepcopy(
              m13['config']['config']['visState'].get('interactionConfig', {}).get('tooltip', {}).get('fieldsToShow', {})
          ))
          full.setdefault('info', {})['title'] = 'NC State Main Campus distance-band audit'
          full['info']['description'] = (
              'Complete audit with 0–1 mile listings, >1–3 mile listings, the Main Campus '
              'reference point, and separate 1-mile and 3-mile straight-line radius layers.'
          )
          (base / 'ncsu-rent-main-campus-distance-audit.kepler.gl.json').write_text(
              json.dumps(full, ensure_ascii=False, separators=(',', ':')), encoding='utf-8'
          )

          # Publish the radius geometry as a genuinely separate GeoJSON source file too.
          features = []
          for dsid in ('radius_1', 'radius_3'):
              row = circle_ds[dsid]['data']['allData'][0]
              fields_ds = [f['name'] for f in circle_ds[dsid]['data']['fields']]
              rec = dict(zip(fields_ds, row))
              geom = json.loads(rec.pop('_geojson'))
              features.append({'type':'Feature','properties':rec,'geometry':geom})
          geojson = {'type':'FeatureCollection','features':features}
          (base / 'ncsu-rent-main-campus_radius-circles.geojson').write_text(
              json.dumps(geojson, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          # Also publish the listing datasets as plain CSV audit sources.
          def export_csv(doc, dataset_id, filename):
              ds = next(d for d in doc['datasets'] if d['data']['id'] == dataset_id)['data']
              cols = [f['name'] for f in ds['fields']]
              out = io.StringIO(newline='')
              w = csv.writer(out)
              w.writerow(cols)
              w.writerows(ds['allData'])
              (base / filename).write_text(out.getvalue(), encoding='utf-8')

          export_csv(m01, 'main_0_1', 'ncsu-rent-main-campus_0-1mi-distance.csv')
          export_csv(m13, 'main_1_3', 'ncsu-rent-main-campus_1-3mi-distance.csv')

          # Make the reference wording match the corrected setup.
          refs = Path('references.html')
          text = refs.read_text(encoding='utf-8')
          text = text.replace(
              'Separate 1-mile and 3-mile boundary map so the circles can be inspected or hidden independently from the listing files.',
              'The radius geometry is also kept as its own Kepler/GeoJSON source. In the listing audit maps, the 1-mile and 3-mile circles load as separate toggleable layers so the boundaries can be checked directly against the listings.'
          )
          text = text.replace(
              'The radius circles also have their own Kepler file so you can isolate or disable the boundaries without touching the listing layers.',
              'The radius circles also have their own source file, while the main Kepler audit preloads them as separate toggleable layers alongside the listing points.'
          )
          refs.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kepler references.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show radius boundaries in Kepler distance audits [skip ci]"
            git push
          fi