name: Clarify NC minimum wage labels
on:
  push:
    paths:
      - .github/workflows/clarify-nc-minimum-wage.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update minimum wage labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The compact earnings card needs the fuller label.
          compact = '<span>Federal minimum</span>'
          if compact not in s:
              raise SystemExit('Compact Federal minimum label not found')
          s = s.replace(compact, '<span>Federal & NC minimum wage</span>')

          # Keep the other user-facing labels consistent, including the
          # threshold marker and the wage-context heading.
          remaining = s.count('Federal minimum')
          if remaining < 1:
              raise SystemExit('No remaining Federal minimum labels found')
          s = s.replace('Federal minimum', 'Federal & NC minimum')

          p.write_text(s, encoding='utf-8')
          print(f'Updated compact label plus {remaining} other Federal minimum label(s).')
          PY
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/clarify-nc-minimum-wage.yml
          git add index.html .github/workflows/clarify-nc-minimum-wage.yml
          git commit -m "Clarify federal and NC minimum wage labels [skip ci]"
          git push
