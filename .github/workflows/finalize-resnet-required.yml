name: Finalize required ResNet display
on:
  push:
    paths:
      - .github/finalize-resnet-required.py
      - .github/workflows/finalize-resnet-required.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final ResNet cleanup
        run: python .github/finalize-resnet-required.py
      - name: Commit draft cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898257+StrokeOfLuck@users.noreply.github.com"
          git add draft-story-0915.html index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Finalize required ResNet display"
            git push
          fi
