name: Assemble housing report assets

on:
  push:
    paths:
      - "data/audits/.housing-report-assets-ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble PDF and screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -d data/audits/.housing-report-pdf-b64 || exit 0
          test -d data/audits/.housing-report-png-b64 || exit 0
          mkdir -p assets
          cat data/audits/.housing-report-pdf-b64/part-* | tr -d '\n\r' | base64 --decode > assets/2023-food-and-housing-insecurity.pdf
          cat data/audits/.housing-report-png-b64/part-* | tr -d '\n\r' | base64 --decode > assets/housing-coa-4-of-14-evidence.png
          test "$(stat -c%s assets/2023-food-and-housing-insecurity.pdf)" -gt 600000
          test "$(stat -c%s assets/housing-coa-4-of-14-evidence.png)" -gt 100000
      - name: Commit assembled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2023-food-and-housing-insecurity.pdf assets/housing-coa-4-of-14-evidence.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add March 2024 housing insecurity report evidence"
          git push
