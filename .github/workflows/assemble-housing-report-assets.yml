name: Add March 2024 housing report

on:
  push:
    paths:
      - "data/audits/.housing-report-assets-ready"

permissions:
  contents: write

jobs:
  add-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the exact NC State report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3             "https://dasa.ncsu.edu/wp-content/uploads/sites/76/2024/03/Homelessness-and-Food-and-Housing-Insecurity-Among-NC-State-Students-March-2024.pdf"             -o "assets/2023 food and housing insecurity.pdf"
          echo "9a154f911e56c4608820695724c8e0b0a1efaa5b14c2aed1a814000c4cf3f49c  assets/2023 food and housing insecurity.pdf" | sha256sum -c -
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/2023 food and housing insecurity.pdf"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add March 2024 NC State housing insecurity report"
          git push
