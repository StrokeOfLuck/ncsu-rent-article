name: Assemble housing report assets

on:
  push:
    paths:
      - "data/audits/.housing-report-assets-ready"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch report and assemble exact screenshot
        shell: bash
        run: |
          set -euo pipefail
          test -d data/audits/.housing-report-png-b64 || exit 0
          mkdir -p assets
          curl -L --fail --retry 3             "https://dasa.ncsu.edu/wp-content/uploads/sites/76/2024/03/Homelessness-and-Food-and-Housing-Insecurity-Among-NC-State-Students-March-2024.pdf"             -o assets/2023-food-and-housing-insecurity.pdf
          echo "9a154f911e56c4608820695724c8e0b0a1efaa5b14c2aed1a814000c4cf3f49c  assets/2023-food-and-housing-insecurity.pdf" | sha256sum -c -
          cat data/audits/.housing-report-png-b64/part-* | tr -d '\n\r' | base64 --decode > assets/housing-coa-4-of-14-evidence.png
          echo "d8ba945a9758c24cda86641c782e03bf3d557fa9f8f21a4fe4ff21fe9f634553  assets/housing-coa-4-of-14-evidence.png" | sha256sum -c -
      - name: Commit report assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/2023-food-and-housing-insecurity.pdf assets/housing-coa-4-of-14-evidence.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add March 2024 housing insecurity report evidence"
          git push
