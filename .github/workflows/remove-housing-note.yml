name: Remove redundant housing comparison note
on:
  push:
    paths:
      - .github/workflows/remove-housing-note.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove note
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '          <div class="housing-monthly-foot">Dorm rates are semester charges converted to monthly equivalents for comparison. The off-campus per-bedroom figure is advertised rent; the residence-hall figure is per student. See the references page for the step-by-step calculation.</div>\n'
          if target not in s:
              raise SystemExit('Expected housing comparison note not found')
          s = s.replace(target, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-housing-note.yml
          git add index.html .github/workflows/remove-housing-note.yml
          git commit -m "Remove redundant housing comparison note [skip ci]"
          git push
