name: Update overall rent summary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chatgpt-update-overall-rent-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pool unique listings and document the math
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit article and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-update-overall-rent-summary.yml
          git add index.html references.html .github/workflows/chatgpt-update-overall-rent-summary.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use pooled unique listings for overall rent summary"
          git push
