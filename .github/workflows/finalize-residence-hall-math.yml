name: Finalize residence hall math
on:
  push:
    paths:
      - .github/workflows/finalize-residence-hall-math.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize reference math
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('references.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<strong>Midpoint:</strong> ($877.78 + $915.56) ÷ 2 = <strong>$896.67/month ≈ $897</strong>', '<strong>Midpoint:</strong> (($3,800 + $3,970) ÷ 2 + $150) × 2 ÷ 9 = <strong>$896.67/month ≈ $897</strong>')
          s = s.replace('<strong>Midpoint:</strong> ($983.33 + $1,055.56) ÷ 2 = <strong>$1,019.45/month ≈ $1,019</strong>', '<strong>Midpoint:</strong> (($4,275 + $4,600) ÷ 2 + $150) × 2 ÷ 9 = <strong>$1,019.44/month ≈ $1,019</strong>')
          s = s.replace('$1,055.56/month ≈ ,056</strong>', '$1,055.56/month ≈ $1,056</strong>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-residence-hall-math.yml
          git add references.html .github/workflows/finalize-residence-hall-math.yml
          git commit -m "Finalize residence hall reference math [skip ci]"
          git push
