name: Validate audit workbooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-audit-workbooks.yml'
      - 'data/audits/ncsu-room-rent-audit.xlsx'
      - 'data/audits/ncsu-room-utilities-audit.xlsx'
      - 'data/audits/ncsu-room-utilities-audit.csv'
      - 'scripts/verify_room_audit.py'
      - 'data/reviewed-rentals.json'
      - 'assets/rent-analysis.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify XLSX containers
        run: |
          unzip -t data/audits/ncsu-room-rent-audit.xlsx
          unzip -t data/audits/ncsu-room-utilities-audit.xlsx

      - name: Verify room audit
        run: python scripts/verify_room_audit.py
